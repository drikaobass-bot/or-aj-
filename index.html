<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orça Já - Gerador de Orçamentos e Recibos</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a',
              700: '#15803d', 800: '#166534',
            }
          },
          fontFamily: { sans: ['Inter', 'sans-serif'] }
        }
      }
    }
  </script>

  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .a4-page { min-height: 297mm; width: 100%; max-width: 210mm; margin: 0 auto; background: white; page-break-after: always; }

    @media print {
      html, body { background: white !important; margin: 0 !important; padding: 0 !important; height: auto !important; overflow: visible !important; }
      #app, #toast, .no-print, header, nav, button:not(#printable-document button) { display: none !important; }
      #modal-container { position: static !important; background: white !important; padding: 0 !important; margin: 0 !important; display: block !important; overflow: visible !important; }
      #modal-content { max-height: none !important; box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
      #printable-document { position: static !important; width: 100% !important; max-width: 100% !important; min-height: auto !important; margin: 0 !important; padding: 10mm !important; box-shadow: none !important; border: none !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-20 md:pb-6">

  <div id="app" class="max-w-4xl mx-auto min-h-screen flex flex-col bg-white shadow-xl md:my-4 md:rounded-2xl overflow-hidden border border-slate-200">

    <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 flex items-center justify-between border-b border-slate-800 shadow-sm">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-green-400 flex items-center justify-center font-bold text-slate-900 shadow-md">
          <i class="fa-solid fa-bolt text-lg"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-white leading-none">Orça Já</h1>
          <p class="text-[11px] text-slate-400 font-medium">Orçamentos & Recibos em 1 min</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="app.openPaywall()" id="plan-badge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 transition-all">
          <i class="fa-solid fa-crown text-[10px] text-amber-400"></i>
          <span id="plan-text">Carregando…</span>
        </button>
        <button onclick="app.openAuthModal()" id="auth-btn" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition-all">Entrar</button>
      </div>
    </header>

    <main id="main-content" class="flex-1 p-4 md:p-6 overflow-y-auto"></main>

    <nav class="fixed bottom-0 left-0 right-0 max-w-4xl mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 px-2 py-1.5 flex justify-around items-center md:sticky md:border-t-0 md:bg-transparent">
      <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i><span>Início</span>
      </button>
      <button onclick="app.navigate('quotes')" id="nav-quotes" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-file-invoice text-lg mb-0.5"></i><span>Orçamentos</span>
      </button>
      <button onclick="app.startNewQuote()" class="w-12 h-12 -mt-5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center shadow-lg shadow-emerald-600/30 active:scale-95 transition-all">
        <i class="fa-solid fa-plus text-xl"></i>
      </button>
      <button onclick="app.navigate('receipts')" id="nav-receipts" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-receipt text-lg mb-0.5"></i><span>Recibos</span>
      </button>
      <button onclick="app.navigate('clients')" id="nav-clients" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-users text-lg mb-0.5"></i><span>Clientes</span>
      </button>
      <button onclick="app.navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-gear text-lg mb-0.5"></i><span>Ajustes</span>
      </button>
    </nav>
  </div>

  <div id="toast" class="fixed top-16 right-4 z-50 transform translate-y-[-100px] opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700 max-w-sm">
      <div id="toast-icon" class="text-emerald-400 text-lg"><i class="fa-solid fa-circle-check"></i></div>
      <p id="toast-message" class="text-sm font-medium">Operação realizada!</p>
    </div>
  </div>

  <!-- Modal com suporte a fechamento ao clicar fora -->
  <div id="modal-container" onclick="app.handleModalBackdropClick(event)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div id="modal-content" onclick="event.stopPropagation()" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto transform transition-all"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ecxgdndfyazyyhhctlgc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjeGdkbmRmeWF6eXloaGN0bGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTA1NjUsImV4cCI6MjEwNzEyNjU2NX0.Heypx90Tvayc1c6-Y0T_YiBXNZvs1-BOEFxPF_YBNnM';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <script>
    const DEFAULT_PROFILE = {
      name: '', tradeName: '', document: '', phone: '', email: '',
      address: '', profession: 'Prestador de Serviços', pixKey: '',
      footerTerms: 'Orçamento válido por 7 dias. Pagamento em até 3x no cartão sem juros ou 5% de desconto no Pix.'
    };

    const QUOTE_STATUSES = ['Rascunho', 'Enviado', 'Aprovado', 'Recusado'];
    const SUBSCRIPTION_CHECK_INTERVAL = 5 * 60 * 1000;

    const EMPTY_ACCESS = {
      access: false,
      is_pro: false,
      is_admin: false,
      has_free_trial: false,
      can_create_quote: false,
      quote_count: 0
    };

    class OrçaJaApp {
      constructor() {
        this.user = null;
        this.profile = { ...DEFAULT_PROFILE };
        this.accessInfo = { ...EMPTY_ACCESS };
        this.subscription = null;
        this.clients = [];
        this.quotes = [];
        this.receipts = [];
        this.currentTab = 'dashboard';
        this.activeQuote = null;
        this.subscriptionTimer = null;
      }

      generateId() {
        if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }

      formatCurrency(val) {
        return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
      }
      formatDate(str) {
        if (!str) return '';
        const parts = String(str).split('-');
        if (parts.length !== 3) return str;
        const [y, m, d] = parts;
        return `${d}/${m}/${y}`;
      }
      escapeHTML(str) {
        if (str == null) return '';
        return String(str).replace(/[&<>'"]/g, tag => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
      }

      isPro() {
        return !!(this.accessInfo && (this.accessInfo.is_pro || this.accessInfo.is_admin));
      }
      isAdmin() {
        return !!(this.accessInfo && this.accessInfo.is_admin);
      }
      hasFullAccess() {
        if (this.isPro()) return true;
        return !!(this.accessInfo && this.accessInfo.has_free_trial === true);
      }

      requireFullAccess(actionLabel = 'esta função') {
        if (!this.user) {
          this.showToast('Entre com sua conta para continuar.', 'error');
          this.openAuthModal();
          return false;
        }
        if (!this.hasFullAccess()) {
          this.showToast('Assine o plano Pro para ' + actionLabel + '.', 'error');
          this.openPaywall();
          return false;
        }
        return true;
      }

      async init() {
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          this.user = session?.user || null;
          if (this.user) {
            await this.loadUserDataFromSupabase();
            await this.loadAccessStatus();
            await this.loadSubscription();
          } else {
            this.loadLocalFallback();
            this.accessInfo = { ...EMPTY_ACCESS };
          }
          this.updateHeaderBadge();
          this.navigate('dashboard');
          this.startSubscriptionWatcher();
        } catch (e) {
          console.error('Erro na inicialização:', e);
          this.loadLocalFallback();
          this.accessInfo = { ...EMPTY_ACCESS };
          this.updateHeaderBadge();
          this.navigate('dashboard');
        }
      }

      startSubscriptionWatcher() {
        if (this.subscriptionTimer) clearInterval(this.subscriptionTimer);
        this.subscriptionTimer = setInterval(async () => {
          if (this.user) {
            await this.loadAccessStatus();
            await this.loadSubscription();
            this.updateHeaderBadge();
          }
        }, SUBSCRIPTION_CHECK_INTERVAL);
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible' && this.user) {
            await this.loadAccessStatus();
            await this.loadSubscription();
            this.updateHeaderBadge();
          }
        });
      }

      async loadAccessStatus() {
        if (!this.user) {
          this.accessInfo = { ...EMPTY_ACCESS };
          return;
        }
        try {
          const { data, error } = await supabaseClient.rpc('check_access');
          if (error) {
            console.error('Erro ao verificar acesso:', error);
            if (!this.accessInfo) this.accessInfo = { ...EMPTY_ACCESS };
            return;
          }
          if (data && typeof data === 'object') {
            this.accessInfo = {
              access: !!data.access,
              is_pro: !!data.is_pro,
              is_admin: !!data.is_admin,
              has_free_trial: !!data.has_free_trial,
              can_create_quote: !!data.can_create_quote,
              quote_count: Number(data.quote_count) || 0,
              plan_type: data.plan_type,
              end_date: data.end_date
            };
          } else {
            this.accessInfo = { ...EMPTY_ACCESS };
          }
        } catch (e) {
          console.error('Erro RPC check_access:', e);
          if (!this.accessInfo) this.accessInfo = { ...EMPTY_ACCESS };
        }
      }

      async loadSubscription() {
        if (!this.user) { this.subscription = null; return; }
        try {
          const { data, error } = await supabaseClient
            .from('subscriptions')
            .select('*')
            .eq('user_id', this.user.id)
            .order('created_at', { ascending: false })
            .limit(1)
            .maybeSingle();

          if (error || !data) { this.subscription = null; return; }

          const now = new Date();
          const end = new Date(data.end_date);
          const isActive = data.status === 'active' && end > now;
          this.subscription = {
            ...data,
            isActive,
            daysRemaining: isActive ? Math.ceil((end - now) / (1000 * 60 * 60 * 24)) : 0,
          };
        } catch (e) {
          console.error('Erro ao carregar assinatura:', e);
          this.subscription = null;
        }
      }

      loadLocalFallback() {
        try {
          this.profile = JSON.parse(localStorage.getItem('orca_profile')) || { ...DEFAULT_PROFILE };
          this.clients = JSON.parse(localStorage.getItem('orca_clients')) || [];
          this.quotes = JSON.parse(localStorage.getItem('orca_quotes')) || [];
          this.receipts = JSON.parse(localStorage.getItem('orca_receipts')) || [];
        } catch (e) {
          this.profile = { ...DEFAULT_PROFILE };
          this.clients = []; this.quotes = []; this.receipts = [];
        }
      }

      async loadUserDataFromSupabase() {
        if (!this.user) return;
        try {
          let { data: profileData, error: profErr } = await supabaseClient
            .from('profiles').select('*').eq('id', this.user.id).maybeSingle();

          if (profErr) console.error('Erro ao buscar perfil:', profErr);

          if (!profileData) {
            const newProf = {
              id: this.user.id,
              email: this.user.email,
              name: '', trade_name: '', document: '', phone: '',
              address: '', profession: 'Prestador de Serviços',
              pix_key: '', footer_terms: DEFAULT_PROFILE.footerTerms
            };
            const { error: insErr } = await supabaseClient.from('profiles').upsert([newProf], { onConflict: 'id' });
            if (!insErr) profileData = newProf;
          }

          if (profileData) {
            this.profile = {
              name: profileData.name || '',
              tradeName: profileData.trade_name || '',
              document: profileData.document || '',
              phone: profileData.phone || '',
              email: profileData.email || this.user.email || '',
              address: profileData.address || '',
              profession: profileData.profession || 'Prestador de Serviços',
              pixKey: profileData.pix_key || '',
              footerTerms: profileData.footer_terms || DEFAULT_PROFILE.footerTerms,
            };
          } else {
            this.profile = { ...DEFAULT_PROFILE, email: this.user.email || '' };
          }

          const { data: clientsData } = await supabaseClient
            .from('clients').select('*').eq('user_id', this.user.id).order('name', { ascending: true });
          this.clients = (clientsData || []).map(c => ({
            id: c.id, name: c.name || '', phone: c.phone || '',
            email: c.email || '', address: c.address || ''
          }));

          const { data: quotesData } = await supabaseClient
            .from('quotes').select('*').eq('user_id', this.user.id).order('number', { ascending: false });
          this.quotes = (quotesData || []).map(q => ({
            id: q.id, number: q.number, clientName: q.client_name || '',
            date: q.date, validityDays: q.validity_days || 7,
            status: q.status || 'Rascunho',
            items: Array.isArray(q.items) ? q.items : [],
            discountType: q.discount_type || 'valor',
            discountValue: Number(q.discount_value) || 0,
            extraFee: Number(q.extra_fee) || 0,
            subtotal: Number(q.subtotal) || 0,
            total: Number(q.total) || 0,
            paymentMethod: q.payment_method || '',
            timeframe: q.timeframe || '',
            notes: q.notes || ''
          }));

          const { data: receiptsData } = await supabaseClient
            .from('receipts').select('*').eq('user_id', this.user.id).order('number', { ascending: false });
          this.receipts = (receiptsData || []).map(r => ({
            id: r.id, number: r.number, payerName: r.payer_name || '',
            receiverName: r.receiver_name || '', date: r.date,
            amount: Number(r.amount) || 0, description: r.description || '',
            paymentMethod: r.payment_method || 'Pix', notes: r.notes || ''
          }));
        } catch (e) {
          console.error('Erro ao carregar dados do Supabase:', e);
          this.loadLocalFallback();
        }
      }

      async saveState() {
        try {
          localStorage.setItem('orca_profile', JSON.stringify(this.profile));
          localStorage.setItem('orca_clients', JSON.stringify(this.clients));
          localStorage.setItem('orca_quotes', JSON.stringify(this.quotes));
          localStorage.setItem('orca_receipts', JSON.stringify(this.receipts));
        } catch (e) { /* ignore */ }

        if (this.user) {
          const payload = {
            name: this.profile.name || '',
            trade_name: this.profile.tradeName || '',
            document: this.profile.document || '',
            phone: this.profile.phone || '',
            email: this.profile.email || '',
            address: this.profile.address || '',
            profession: this.profile.profession || '',
            pix_key: this.profile.pixKey || '',
            footer_terms: this.profile.footerTerms || ''
          };
          const { error } = await supabaseClient.from('profiles').update(payload).eq('id', this.user.id);
          if (error) console.error('Erro ao salvar perfil:', error);
        }
        this.updateHeaderBadge();
      }

      updateHeaderBadge() {
        const badgeText = document.getElementById('plan-text');
        const badgeBtn = document.getElementById('plan-badge');
        const authBtn = document.getElementById('auth-btn');
        if (!badgeText) return;

        if (!this.user) {
          badgeText.textContent = 'Plano Grátis';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 transition-all';
        } else if (this.isAdmin()) {
          badgeText.textContent = 'Admin';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-400/20 text-purple-300 border border-purple-400/40';
        } else if (this.isPro()) {
          badgeText.textContent = 'Plano Pro';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-400/20 text-amber-300 border border-amber-400/40';
        } else if (this.accessInfo?.has_free_trial) {
          badgeText.textContent = 'Teste Grátis';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 transition-all';
        } else {
          badgeText.textContent = 'Grátis';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-500/10 text-slate-400 border border-slate-500/30 hover:bg-slate-500/20 transition-all';
        }

        if (this.user) {
          authBtn.textContent = 'Sair';
          authBtn.onclick = () => this.logout();
        } else {
          authBtn.textContent = 'Entrar';
          authBtn.onclick = () => this.openAuthModal();
        }
      }

      async logout() {
        if (this.subscriptionTimer) clearInterval(this.subscriptionTimer);
        await supabaseClient.auth.signOut();
        this.user = null;
        this.profile = { ...DEFAULT_PROFILE };
        this.accessInfo = { ...EMPTY_ACCESS };
        this.subscription = null;
        this.clients = []; this.quotes = []; this.receipts = [];
        try {
          localStorage.removeItem('orca_profile');
          localStorage.removeItem('orca_clients');
          localStorage.removeItem('orca_quotes');
          localStorage.removeItem('orca_receipts');
        } catch (e) {}
        this.showToast('Sessão encerrada com sucesso.');
        this.init();
      }

      showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        const msgEl = document.getElementById('toast-message');
        const iconEl = document.getElementById('toast-icon');
        msgEl.textContent = message;
        iconEl.className = type === 'error' ? 'text-rose-400 text-lg' : 'text-emerald-400 text-lg';
        iconEl.innerHTML = type === 'error' ? '<i class="fa-solid fa-circle-exclamation"></i>' : '<i class="fa-solid fa-circle-check"></i>';
        toast.classList.remove('translate-y-[-100px]', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.add('translate-y-[-100px]', 'opacity-0');
          toast.classList.remove('translate-y-0', 'opacity-100');
        }, 3500);
      }

      handleModalBackdropClick(e) {
        if (e.target && e.target.id === 'modal-container') {
          this.closeModal();
        }
      }

      navigate(tab, params = {}) {
        this.currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.remove('text-emerald-600', 'font-bold');
          btn.classList.add('text-slate-500');
        });
        const activeNav = document.getElementById(`nav-${tab}`);
        if (activeNav) {
          activeNav.classList.remove('text-slate-500');
          activeNav.classList.add('text-emerald-600', 'font-bold');
        }
        const container = document.getElementById('main-content');
        switch (tab) {
          case 'dashboard': container.innerHTML = this.renderDashboard(); break;
          case 'quotes': container.innerHTML = this.renderQuotesList(); break;
          case 'editor': container.innerHTML = this.renderQuoteEditor(params.quoteId); break;
          case 'receipts': container.innerHTML = this.renderReceiptsList(); break;
          case 'clients': container.innerHTML = this.renderClientsList(); break;
          case 'settings': container.innerHTML = this.renderSettings(); break;
          default: container.innerHTML = this.renderDashboard();
        }
      }

      renderDashboard() {
        const approvedValue = this.quotes.filter(q => q.status === 'Aprovado').reduce((s, q) => s + q.total, 0);
        const totalSent = this.quotes.filter(q => q.status === 'Enviado' || q.status === 'Aprovado').length;
        const totalApproved = this.quotes.filter(q => q.status === 'Aprovado').length;
        const recentQuotes = [...this.quotes].slice(0, 5);
        const quoteCount = this.accessInfo?.quote_count ?? this.quotes.length;

        let usageLabel = 'Bloqueado';
        let usageValue = '0/1';
        if (this.isAdmin()) { usageLabel = 'Admin'; usageValue = 'Ilimitado'; }
        else if (this.isPro()) { usageLabel = 'Pro'; usageValue = 'Ilimitado'; }
        else if (this.accessInfo?.has_free_trial) { usageLabel = 'Teste'; usageValue = `${quoteCount}/1`; }

        return `
          <div class="space-y-6 animate-fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">

            <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden">
              ${this.quotes.length === 0 ? `<div class="p-8 text-center text-slate-400 text-sm">Nenhum orçamento encontrado.</div>` : this.quotes.map(q => this.renderQuoteCardRow(q)).join('')}
            </div>
          </div>
        `;

      async startNewQuote() {
        if (!this.user) {
          this.showToast('Entre com sua conta para criar orçamentos.', 'error');
          this.openAuthModal();
          return;
        }

        await this.loadAccessStatus();

        if (this.isPro()) {
          this._createNewQuote();
          return;
        }

        if (this.accessInfo?.has_free_trial) {
          try {
            const { data, error } = await supabaseClient.rpc('consume_free_trial');
            if (error) {
              this.showToast('Erro ao liberar orçamento. Tente novamente.', 'error');
              return;
            }
            if (data && data.success) {
              this.accessInfo.has_free_trial = false;
              this.accessInfo.can_create_quote = false;
              this.updateHeaderBadge();
              this._createNewQuote();
            } else {
              this.showToast(data?.error || 'Você já utilizou seu orçamento gratuito.', 'error');
              this.openPaywall();
            }
          } catch (e) {
            this.showToast('Erro de conexão. Tente novamente.', 'error');
          }
          return;
        }

        this.openPaywall();
      }

      _createNewQuote() {
        const nextNum = this.quotes.length > 0 ? Math.max(...this.quotes.map(q => q.number || 1000)) + 1 : 1001;
        this.activeQuote = {
          id: this.generateId(), number: nextNum,
          clientName: this.clients[0]?.name || '',
          date: new Date().toISOString().split('T')[0],
          validityDays: 7, status: 'Rascunho',
          items: [{ description: '', quantity: 1, unit: 'serviço', unitPrice: 0, subtotal: 0 }],
          discountType: 'valor', discountValue: 0, extraFee: 0,
          subtotal: 0, total: 0,
          paymentMethod: 'Pix ou Cartão', timeframe: 'Imediato',
          notes: this.profile.footerTerms
        };
        this.navigate('editor');
      }

      renderQuoteEditor(quoteId) {

          if (ex) this.activeQuote = JSON.parse(JSON.stringify(ex));

        if (!this.activeQuote) { this.startNewQuote(); return ''; }
        const q = this.activeQuote;
        if (!Array.isArray(q.items) || q.items.length === 0) {
          q.items = [{ description: '', quantity: 1, unit: 'serviço', unitPrice: 0, subtotal: 0 }];
        }
        const statusOptions = QUOTE_STATUSES.map(s => `<option value="${s}" ${q.status === s ? 'selected' : ''}>${s}</option>`).join('');

              <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                <label class="text-xs font-bold uppercase text-slate-500">Status</label>
                <select id="editor-status" onchange="app.activeQuote.status = this.value" class="w-full p-2 text-sm border rounded-lg">${statusOptions}</select>
              </div>
              <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                <label class="text-xs font-bold uppercase text-slate-500">Data de Emissão</label>
                <input type="date" value="${q.date}" onchange="app.activeQuote.date = this.value" class="w-full p-2 text-sm border rounded-lg">
              </div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-4">
              <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-900">Itens / Serviços</h3>
                <button onclick="app.addQuoteItem()" class="px-3 py-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-bold rounded-lg text-xs"><i class="fa-solid fa-plus mr-1"></i> Adicionar Item</button>
              </div>
              <div id="quote-items-container" class="space-y-3">
                ${q.items.map((item, idx) => `
                  <div class="p-3 bg-slate-50 border rounded-xl space-y-2 relative">
                    <div class="flex justify-between items-center">
                      <span class="text-xs font-bold text-slate-500">Item #${idx + 1}</span>${q.items.length > 1 ? `<button onclick="app.removeQuoteItem(${idx})" class="text-rose-500 text-xs font-bold"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                    <input type="text" placeholder="Descrição do serviço ou produto" value="${this.escapeHTML(item.description)}" oninput="app.updateItem(${idx}, 'description', this.value)" class="w-full p-2 text-sm bg-white border rounded-lg">
                    <div class="grid grid-cols-3 gap-2">
                      <div><label class="text-[10px] uppercase text-slate-400 font-bold">Qtd</label><input type="number" step="any" min="0.01" value="${item.quantity}" oninput="app.updateItem(${idx}, 'quantity', this.value)" class="w-full p-1.5 text-sm bg-white border rounded-lg"></div>
                      <div><label class="text-[10px] uppercase text-slate-400 font-bold">Unidade</label><input type="text" value="${this.escapeHTML(item.unit)}" oninput="app.updateItem(${idx}, 'unit', this.value)" class="w-full p-1.5 text-sm bg-white border rounded-lg"></div>
                      <div><label class="text-[10px] uppercase text-slate-400 font-bold">Val. Unitário (R$)</label><input type="number" step="0.01" min="0" value="${item.unitPrice}" oninput="app.updateItem(${idx}, 'unitPrice', this.value)" class="w-full p-1.5 text-sm bg-white border rounded-lg"></div>

                  </div>

                <span>Desconto (R$):</span>
                <input type="number" step="0.01" min="0" value="${q.discountValue}" oninput="app.updateDiscount(this.value)" class="w-28 p-1 text-slate-900 text-right text-sm rounded font-bold">
              </div>
              <div class="flex justify-between text-lg border-t border-slate-700 pt-2 font-black text-emerald-400"><span>Total Final:</span><span id="editor-total-val">${this.formatCurrency(q.total)}</span></div>

            </div>
          </div>

      }

      updateActiveQuoteClient(name) { if (this.activeQuote) this.activeQuote.clientName = name; }

      addQuoteItem() {
        if (!this.activeQuote) return;
        this.activeQuote.items.push({ description: '', quantity: 1, unit: 'un', unitPrice: 0, subtotal: 0 });
        this.recalculateQuoteTotals();
        this.navigate('editor');
      }

      removeQuoteItem(idx) {
        if (!this.activeQuote) return;
        this.activeQuote.items.splice(idx, 1);
        this.recalculateQuoteTotals();
        this.navigate('editor');
      }

      updateItem(idx, field, val) {
        if (!this.activeQuote) return;
        const item = this.activeQuote.items[idx];
        if (!item) return;
        if (field === 'quantity' || field === 'unitPrice') {
          item[field] = val === '' ? 0 : (parseFloat(val) || 0);
          item.subtotal = (item.quantity || 0) * (item.unitPrice || 0);
        } else {
          item[field] = val;
        }
        this.recalculateQuoteTotals();
      }

      updateDiscount(val) {
        if (!this.activeQuote) return;
        this.activeQuote.discountValue = val === '' ? 0 : Math.max(0, parseFloat(val) || 0);
        this.recalculateQuoteTotals();
      }

      recalculateQuoteTotals() {
        if (!this.activeQuote) return;
        const sub = (this.activeQuote.items || []).reduce((acc, it) => acc + (Number(it.subtotal) || 0), 0);
        const disc = Number(this.activeQuote.discountValue) || 0;
        this.activeQuote.subtotal = sub;
        this.activeQuote.total = Math.max(0, sub - disc);
        this.updateEditorTotals();
      }

      updateEditorTotals() {
        if (!this.activeQuote) return;
        const subEl = document.getElementById('editor-subtotal-val');
        const totEl = document.getElementById('editor-total-val');
        if (subEl) subEl.textContent = this.formatCurrency(this.activeQuote.subtotal);
        if (totEl) totEl.textContent = this.formatCurrency(this.activeQuote.total);
      }

      async saveActiveQuote(notify = false, redirectToList = false) {
        if (!this.activeQuote) return false;
        if (!this.requireFullAccess('salvar orçamentos')) return false;

        this.recalculateQuoteTotals();

        // Validação básica de itens
        const hasValidItem = this.activeQuote.items.some(i => i.description.trim() !== '' && i.subtotal > 0);
        if (!hasValidItem) {
          this.showToast('Adicione pelo menos um item válido com descrição e valor.', 'error');
          return false;
        }

        const index = this.quotes.findIndex(q => q.id === this.activeQuote.id);
        if (index >= 0) this.quotes[index] = { ...this.activeQuote };
        else this.quotes.unshift({ ...this.activeQuote });

        const payload = {
          id: this.activeQuote.id, user_id: this.user.id,
          number: this.activeQuote.number, client_name: this.activeQuote.clientName,
          date: this.activeQuote.date, validity_days: this.activeQuote.validityDays,
          status: this.activeQuote.status, items: this.activeQuote.items,
          discount_type: this.activeQuote.discountType,
          discount_value: this.activeQuote.discountValue,
          extra_fee: this.activeQuote.extraFee,
          subtotal: this.activeQuote.subtotal, total: this.activeQuote.total,
          payment_method: this.activeQuote.paymentMethod,
          timeframe: this.activeQuote.timeframe, notes: this.activeQuote.notes
        };

        const { error } = await supabaseClient.from('quotes').upsert(payload, { onConflict: 'id' });
        if (error) {
          console.error('Erro ao salvar orçamento no Supabase:', error);
          this.showToast('Falha ao sincronizar. Tente novamente.', 'error');
          return false;
        }

        await this.saveState();
        if (notify) this.showToast('Orçamento salvo com sucesso!');
        if (redirectToList) this.navigate('quotes');
        return true;
      }

      async deleteQuote(id) {
        if (!this.requireFullAccess('excluir orçamentos')) return;
        if (!confirm('Deseja realmente excluir este orçamento?')) return;
        this.quotes = this.quotes.filter(q => q.id !== id);
        const { error } = await supabaseClient.from('quotes').delete().eq('id', id);
        if (error) { this.showToast('Erro ao excluir.', 'error'); return; }
        await this.saveState();
        this.showToast('Orçamento excluído.');
        this.navigate('quotes');
      }

        const ok = await this.saveActiveQuote(false, false);
        if (!ok) return;
        this.previewPDF(this.activeQuote.id);
      }

              </div>
              <table class="w-full text-left border-collapse">
                <thead>
                  <tr class="border-b bg-slate-50 text-xs text-slate-500 uppercase">
                    <th class="py-2 px-3">Descrição</th>

                  `).join('')}

              <div class="flex justify-end pt-4 border-t">
                <div class="w-64 space-y-2 text-xs">
                  <div class="flex justify-between"><span>Subtotal:</span><span>${this.formatCurrency(q.subtotal)}</span></div>
                  ${q.discountValue > 0 ? `<div class="flex justify-between text-rose-600"><span>Desconto:</span><span>- ${this.formatCurrency(q.discountValue)}</span></div>` : ''}
                  <div class="flex justify-between text-sm font-black border-t pt-2 text-slate-900"><span>Total Final:</span><span>${this.formatCurrency(q.total)}</span></div>
                </div>
              </div>
              <div class="pt-6 border-t text-[11px] text-slate-500 space-y-1">
                <p><strong>Condições:</strong> ${this.escapeHTML(q.notes || this.profile.footerTerms)}</p>
              </div>
            </div>
            <div class="flex justify-end space-x-2 no-print"><button onclick="window.print()" class="px-5 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold"><i class="fa-solid fa-print mr-1"></i> Imprimir / PDF</button></div>
          </div>

        modal.classList.remove('hidden');
      }

      renderReceiptsList() {
        return `
          <div class="space-y-4 animate-fade-in">
            <div class="flex justify-between items-center"><h2 class="text-xl font-bold text-slate-900">Recibos Emitidos</h2><button onclick="app.startNewReceipt()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center space-x-1"><i class="fa-solid fa-plus"></i><span>Novo Recibo</span></button></div>
            <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden">
              ${this.receipts.length === 0 ? `<div class="p-8 text-center text-slate-400 text-sm">Nenhum recibo emitido.</div>` : this.receipts.map(r => {
                const safeId = this.escapeHTML(r.id);
                return `
                <div class="p-4 hover:bg-slate-50 transition-colors flex justify-between items-center">
                  <div>
                    <h4 class="font-bold text-slate-900 text-sm">Recibo #${r.number} -${this.escapeHTML(r.payerName)}</h4>
                    <p class="text-xs text-slate-500">${this.formatDate(r.date)} •${this.formatCurrency(r.amount)}</p>
                  </div>
                  <div class="flex space-x-1">
                    <button onclick="app.previewReceiptPDF('${safeId}')" class="p-2 text-slate-500 hover:text-rose-600 rounded-lg"><i class="fa-solid fa-file-pdf"></i></button>
                    <button onclick="app.deleteReceipt('${safeId}')" class="p-2 text-slate-500 hover:text-rose-600 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </div>
              `;}).join('')}
            </div>
          </div>
        `;
      }

      startNewReceipt() {
        if (!this.requireFullAccess('emitir recibos')) return;
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `
          <div class="p-6 space-y-4">
            <div class="flex justify-between border-b pb-3"><h3 class="font-bold">Emitir Novo Recibo</h3><button onclick="app.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>
            <form onsubmit="app.saveReceipt(event)" class="space-y-3">
              <div><label class="text-xs font-bold uppercase text-slate-500">Nome do Pagador</label><input type="text" id="rcpt-payer" required class="w-full p-2 border rounded-lg text-sm"></div>
              <div class="grid grid-cols-2 gap-2">
                <div><label class="text-xs font-bold uppercase text-slate-500">Valor (R$)</label><input type="number" step="0.01" min="0" id="rcpt-amount" required class="w-full p-2 border rounded-lg text-sm"></div>
                <div><label class="text-xs font-bold uppercase text-slate-500">Data</label><input type="date" id="rcpt-date" value="${new Date().toISOString().split('T')[0]}" required class="w-full p-2 border rounded-lg text-sm"></div>
              </div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Descrição / Referente a</label><textarea id="rcpt-desc" required rows="2" class="w-full p-2 border rounded-lg text-sm"></textarea></div>
              <div class="flex justify-end pt-2"><button type="submit" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">Emitir Recibo</button></div>
            </form>
          </div>
        `;
        modal.classList.remove('hidden');
      }

      async saveReceipt(e) {
        e.preventDefault();
        if (!this.requireFullAccess('emitir recibos')) return;
        const nextNum = this.receipts.length > 0 ? Math.max(...this.receipts.map(r => r.number || 100)) + 1 : 101;
        const newR = {
          id: this.generateId(), number: nextNum,
          payerName: document.getElementById('rcpt-payer').value.trim(),
          receiverName: this.profile.tradeName || this.profile.name || '',
          date: document.getElementById('rcpt-date').value,
          amount: parseFloat(document.getElementById('rcpt-amount').value) || 0,
          description: document.getElementById('rcpt-desc').value.trim(),
          paymentMethod: 'Pix', notes: ''
        };
        this.receipts.unshift(newR);
        const { error } = await supabaseClient.from('receipts').insert([{
          id: newR.id, user_id: this.user.id, number: newR.number,
          payer_name: newR.payerName, receiver_name: newR.receiverName,
          date: newR.date, amount: newR.amount, description: newR.description,
          payment_method: newR.paymentMethod, notes: newR.notes
        }]);
        if (error) {
          this.showToast('Falha ao salvar recibo.', 'error');
          return;
        }
        await this.saveState();
        this.closeModal();
        this.showToast('Recibo emitido com sucesso!');
        this.navigate('receipts');
      }

      async deleteReceipt(id) {
        if (!this.requireFullAccess('excluir recibos')) return;
        if (!confirm('Deseja excluir este recibo?')) return;
        this.receipts = this.receipts.filter(r => r.id !== id);
        const { error } = await supabaseClient.from('receipts').delete().eq('id', id);
        if (error) { this.showToast('Erro ao excluir.', 'error'); return; }
        await this.saveState();
        this.showToast('Recibo excluído.');
        this.navigate('receipts');
      }

      previewReceiptPDF(id) {
        if (!this.requireFullAccess('gerar PDFs')) return;
        const r = this.receipts.find(item => item.id === id);
        if (!r) { this.showToast('Recibo não encontrado.', 'error'); return; }
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `
          <div class="p-6 space-y-4">
            <div class="flex justify-between border-b pb-3 no-print"><h3 class="font-bold">Pré-visualização do Recibo</h3><button onclick="app.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>
            <div id="printable-document" class="a4-page p-10 border rounded-xl bg-white space-y-6 text-slate-800 text-sm">
              <div class="text-center border-b pb-4">
                <h2 class="text-2xl font-black text-slate-900">RECIBO DE PAGAMENTO #${r.number}</h2>
                <p class="text-xl font-bold text-emerald-600 mt-2">Valor: ${this.formatCurrency(r.amount)}</p>
              </div>
              <div class="space-y-3">
                <p>Recebi(emos) de <strong>${this.escapeHTML(r.payerName)}</strong> a quantia supra de <strong>${this.formatCurrency(r.amount)}</strong>.</p>
                <p>Referente a: <strong>${this.escapeHTML(r.description)}</strong>.</p>
                <p class="text-xs text-slate-500 pt-4">Emitido em: ${this.formatDate(r.date)}</p>
              </div>
              <div class="pt-12 text-center">
                <p class="border-t border-slate-400 w-64 mx-auto pt-2 font-bold">${this.escapeHTML(r.receiverName || this.profile.name)}</p>
                <p class="text-xs text-slate-500">Emitente / Prestador</p>
              </div>
            </div>
            <div class="flex justify-end space-x-2 no-print"><button onclick="window.print()" class="px-5 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold"><i class="fa-solid fa-print mr-1"></i> Imprimir / PDF</button></div>
          </div>
        `;
        modal.classList.remove('hidden');
      }

      renderClientsList() {
        return `
          <div class="space-y-4 animate-fade-in">
            <div class="flex justify-between items-center"><h2 class="text-xl font-bold text-slate-900">Seus Clientes</h2><button onclick="app.openClientModal()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center space-x-1"><i class="fa-solid fa-plus"></i><span>Novo Cliente</span></button></div>
            <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden">
              ${this.clients.length === 0 ? `<div class="p-8 text-center text-slate-400 text-sm">Nenhum cliente cadastrado.</div>` : this.clients.map(c => `
                <div class="p-4 hover:bg-slate-50 transition-colors flex justify-between items-center">
                  <div>
                    <h4 class="font-bold text-slate-900 text-sm">${this.escapeHTML(c.name)}</h4>
                    <p class="text-xs text-slate-500">Tel: ${this.escapeHTML(c.phone \vert{}\vert{} 'N/I')} • E-mail: ${this.escapeHTML(c.email || 'N/I')}</p>
                  </div>
                  <div class="flex space-x-1">
                    <button onclick="app.deleteClient('${this.escapeHTML(c.id)}')" class="p-2 text-slate-500 hover:text-rose-600 rounded-lg"><i class="fa-solid fa-trash"></i></button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      openClientModal() {
        if (!this.requireFullAccess('cadastrar clientes')) return;
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `
          <div class="p-6 space-y-4">
            <div class="flex justify-between border-b pb-3"><h3 class="font-bold">Cadastrar Novo Cliente</h3><button onclick="app.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>
            <form onsubmit="app.saveClient(event)" class="space-y-3">
              <div><label class="text-xs font-bold uppercase text-slate-500">Nome Completo</label><input type="text" id="cli-name" required class="w-full p-2 border rounded-lg text-sm"></div>
              <div class="grid grid-cols-2 gap-2">
                <div><label class="text-xs font-bold uppercase text-slate-500">Telefone / WhatsApp</label><input type="text" id="cli-phone" class="w-full p-2 border rounded-lg text-sm"></div>
                <div><label class="text-xs font-bold uppercase text-slate-500">E-mail</label><input type="email" id="cli-email" class="w-full p-2 border rounded-lg text-sm"></div>
              </div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Endereço</label><input type="text" id="cli-address" class="w-full p-2 border rounded-lg text-sm"></div>
              <div class="flex justify-end pt-2"><button type="submit" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">Salvar Cliente</button></div>
            </form>
          </div>
        `;
        modal.classList.remove('hidden');
      }

      async saveClient(e) {
        e.preventDefault();
        if (!this.requireFullAccess('cadastrar clientes')) return;
        const newC = {
          id: this.generateId(),
          name: document.getElementById('cli-name').value.trim(),
          phone: document.getElementById('cli-phone').value.trim(),
          email: document.getElementById('cli-email').value.trim(),
          address: document.getElementById('cli-address').value.trim()
        };
        this.clients.push(newC);
        const { error } = await supabaseClient.from('clients').insert([{
          id: newC.id, user_id: this.user.id, name: newC.name,
          phone: newC.phone, email: newC.email, address: newC.address
        }]);
        if (error) {
          this.showToast('Falha ao salvar cliente.', 'error');
          return;
        }
        await this.saveState();
        this.closeModal();
        this.showToast('Cliente cadastrado com sucesso!');
        this.navigate('clients');
      }

      async deleteClient(id) {
        if (!this.requireFullAccess('excluir clientes')) return;
        if (!confirm('Deseja excluir este cliente?')) return;
        this.clients = this.clients.filter(c => c.id !== id);
        const { error } = await supabaseClient.from('clients').delete().eq('id', id);
        if (error) { this.showToast('Erro ao excluir.', 'error'); return; }
        await this.saveState();
        this.showToast('Cliente excluído.');
        this.navigate('clients');
      }

      renderSettings() {
        const p = this.profile;
        return `
          <div class="space-y-4 animate-fade-in pb-12">
            <h2 class="text-xl font-bold text-slate-900">Configurações do Prestador</h2>
            <form onsubmit="app.saveSettings(event)" class="bg-white p-5 rounded-xl border border-slate-200 space-y-4">
              <div><label class="text-xs font-bold uppercase text-slate-500">Seu Nome / Razão Social</label><input type="text" id="set-name" value="${this.escapeHTML(p.name)}" required class="w-full p-2 border rounded-lg text-sm"></div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Nome Comercial da Empresa</label><input type="text" id="set-tradename" value="${this.escapeHTML(p.tradeName)}" class="w-full p-2 border rounded-lg text-sm"></div>
              <div class="grid grid-cols-2 gap-3">
                <div><label class="text-xs font-bold uppercase text-slate-500">CPF ou CNPJ</label><input type="text" id="set-doc" value="${this.escapeHTML(p.document)}" class="w-full p-2 border rounded-lg text-sm"></div>
                <div><label class="text-xs font-bold uppercase text-slate-500">Telefone / WhatsApp</label><input type="text" id="set-phone" value="${this.escapeHTML(p.phone)}" class="w-full p-2 border rounded-lg text-sm"></div>
              </div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Profissão / Atividade</label><input type="text" id="set-prof" value="${this.escapeHTML(p.profession)}" class="w-full p-2 border rounded-lg text-sm"></div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Endereço Completo</label><input type="text" id="set-addr" value="${this.escapeHTML(p.address)}" class="w-full p-2 border rounded-lg text-sm"></div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Chave Pix</label><input type="text" id="set-pix" value="${this.escapeHTML(p.pixKey)}" class="w-full p-2 border rounded-lg text-sm"></div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Termos e Condições Padrão de Rodapé</label><textarea id="set-terms" rows="2" class="w-full p-2 border rounded-lg text-sm">${this.escapeHTML(p.footerTerms)}</textarea></div>
              <div class="flex justify-end pt-2"><button type="submit" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">Salvar Configurações</button></div>
            </form>
            ${this.subscription ? `
              <div class="bg-white p-5 rounded-xl border border-slate-200 space-y-2">
                <h3 class="font-bold text-slate-900 text-sm">Sua Assinatura</h3>
                <p class="text-xs text-slate-600">Plano: <strong>${this.subscription.plan_type === 'yearly' ? 'Anual' : 'Mensal'}</strong></p>
                <p class="text-xs text-slate-600">Status: <strong>${this.subscription.status === 'active' ? 'Ativo' : this.subscription.status}</strong></p>
                <p class="text-xs text-slate-600">Válido até: <strong>${this.formatDate(this.subscription.end_date?.split('T')[0])}</strong></p>${this.subscription.isActive && this.subscription.daysRemaining <= 7 ? `<p class="text-xs text-amber-600 font-bold">⚠️ Sua assinatura expira em ${this.subscription.daysRemaining} dia(s). Renove agora!</p>` : ''}
              </div>
            ` : ''}
          </div>
        `;
      }

      async saveSettings(e) {
        e.preventDefault();
        if (!this.user) {
          this.showToast('Entre com sua conta para salvar.', 'error');
          this.openAuthModal();
          return;
        }
        this.profile.name = document.getElementById('set-name').value.trim();
        this.profile.tradeName = document.getElementById('set-tradename').value.trim();
        this.profile.document = document.getElementById('set-doc').value.trim();
        this.profile.phone = document.getElementById('set-phone').value.trim();
        this.profile.profession = document.getElementById('set-prof').value.trim();
        this.profile.address = document.getElementById('set-addr').value.trim();
        this.profile.pixKey = document.getElementById('set-pix').value.trim();
        this.profile.footerTerms = document.getElementById('set-terms').value;
        await this.saveState();
        this.showToast('Configurações salvas com sucesso!');
      }

      openAuthModal() {
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `
          <div class="p-6 space-y-4">
            <div class="flex justify-between border-b pb-3"><h3 class="font-bold text-lg">Acessar / Criar Conta</h3><button onclick="app.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>
            <p class="text-xs text-slate-500">Entre com seu e-mail para sincronizar seus dados com segurança na nuvem.</p>
            <form onsubmit="app.handleAuth(event)" class="space-y-3">
              <div><label class="text-xs font-bold uppercase text-slate-500">E-mail</label><input type="email" id="auth-email" required class="w-full p-2 border rounded-lg text-sm"></div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Senha</label><input type="password" id="auth-pass" required minlength="6" class="w-full p-2 border rounded-lg text-sm"></div>
              <div class="flex space-x-2 pt-2">
                <button type="submit" class="flex-1 py-2.5 bg-slate-900 text-white font-bold rounded-xl text-xs">Entrar</button>
                <button type="button" onclick="app.handleSignUp()" class="flex-1 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">Cadastrar</button>
              </div>
            </form>
          </div>
        `;
        modal.classList.remove('hidden');
      }

      async handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-pass').value;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
        if (error) { this.showToast('Erro ao entrar: ' + error.message, 'error'); return; }
        this.user = data.user;
        this.closeModal();
        this.showToast('Login realizado com sucesso!');
        await this.init();
      }

      async handleSignUp() {
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-pass').value;
        if (!email || !pass) { this.showToast('Preencha e-mail e senha.', 'error'); return; }
        if (pass.length < 6) { this.showToast('A senha deve ter pelo menos 6 caracteres.', 'error'); return; }
        const { data, error } = await supabaseClient.auth.signUp({ email, password: pass });
        if (error) { this.showToast('Erro no cadastro: ' + error.message, 'error'); return; }
        if (data.session) {
          this.user = data.user;
          this.closeModal();
          this.showToast('Conta criada e sessão iniciada!');
          await this.init();
        } else {
          this.showToast('Cadastro realizado! Verifique seu e-mail para confirmar.', 'success');
        }
      }

      openPaywall() {
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `
          <div class="p-6 space-y-5 bg-slate-900 text-white rounded-2xl">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs font-extrabold text-amber-400 uppercase tracking-widest bg-amber-400/10 px-2.5 py-1 rounded-full border border-amber-400/20">Seja Pro</span>
                <h3 class="text-2xl font-black mt-2">Desbloqueie Recursos Pro</h3>
              </div>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <p class="text-xs text-slate-300">Escolha uma das opções abaixo para continuar usando todos os recursos sem limites:</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
              <div class="p-4 bg-gradient-to-br from-emerald-600 to-teal-700 rounded-xl space-y-3 border border-emerald-500 shadow-md flex flex-col justify-between">
                <div>
                  <span class="bg-white/20 text-white text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Mais Popular</span>
                  <p class="text-sm font-bold text-emerald-100 mt-2">Plano Pro Anual</p>
                  <p class="text-xl font-black text-white">R$ 119,00 <span class="text-xs font-normal text-emerald-100">/ano</span></p>
                  <p class="text-[10px] text-emerald-100 mt-1">Pagamento único anual.</p>
                </div>
                <a href="https://cerefy.com.br/checkout/c9d342ca-5bb0-454e-b861-eb36dbefa9e8?user_id=${this.user?.id || ''}" target="_blank" rel="noopener" class="w-full py-2.5 bg-white text-slate-900 font-extrabold rounded-xl text-xs shadow text-center block">Assinar Anual</a>
              </div>
              <div class="p-4 bg-slate-800 rounded-xl space-y-3 border border-slate-700 shadow-md flex flex-col justify-between">
                <div>
                  <span class="bg-slate-700 text-slate-300 text-[10px] font-bold px-2 py-0.5 rounded-full uppercase">Flexível</span>
                  <p class="text-sm font-bold text-slate-200 mt-2">Plano Pro Mensal</p>
                  <p class="text-xl font-black text-white">R$ 14,90 <span class="text-xs font-normal text-slate-400">/mês</span></p>
                  <p class="text-[10px] text-slate-400 mt-1">Cancele quando quiser.</p>
                </div>
                <a href="https://cerefy.com.br/checkout/442c9856-0ce9-474e-bb2f-260c93534c40?user_id=${this.user?.id || ''}" target="_blank" rel="noopener" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold rounded-xl text-xs shadow text-center block">Assinar Mensal</a>
              </div>
            </div>
          </div>
        `;
        modal.classList.remove('hidden');
      }

      closeModal() {
        const modal = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        if (content) content.innerHTML = '';
        if (modal) modal.classList.add('hidden');
      }
    }

    let app;
    window.addEventListener('DOMContentLoaded', async () => {
      app = new OrçaJaApp();
      await app.init();
    });
  </script>
</body>
</html>
