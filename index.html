<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orça Já - Gerador de Orçamentos e Recibos</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#f0fdf4',
              100: '#dcfce7',
              500: '#22c55e',
              600: '#16a34a',
              700: '#15803d',
              800: '#166534',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
          }
        }
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .a4-page { min-height: 297mm; width: 100%; max-width: 210mm; margin: 0 auto; background: white; }

    @media print {
      html, body { background: white !important; margin: 0 !important; padding: 0 !important; height: auto !important; overflow: visible !important; }
      #app, #toast, .no-print, header, nav, button:not(#printable-document button) { display: none !important; }
      #modal-container { position: static !important; background: white !important; padding: 0 !important; margin: 0 !important; display: block !important; overflow: visible !important; }
      #modal-content { max-height: none !important; box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
      #printable-document { position: static !important; width: 100% !important; max-width: 100% !important; min-height: auto !important; margin: 0 !important; padding: 10mm !important; box-shadow: none !important; border: none !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-20 md:pb-6">

  <div id="app" class="max-w-4xl mx-auto min-h-screen flex flex-col bg-white shadow-xl md:my-4 md:rounded-2xl overflow-hidden border border-slate-200">
    
    <!-- Header / Navigation Bar -->
    <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 flex items-center justify-between border-b border-slate-800 shadow-sm">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-green-400 flex items-center justify-center font-bold text-slate-900 shadow-md">
          <i class="fa-solid fa-bolt text-lg"></i>
        </div>
        <div>
          <h1 class="font-extrabold text-lg tracking-tight text-white leading-none">Orça Já</h1>
          <p class="text-[11px] text-slate-400 font-medium">Orçamentos & Recibos em 1 min</p>
        </div>
      </div>

      <div class="flex items-center space-x-2">
        <!-- User Badge Status -->
        <button onclick="app.openPaywall()" id="plan-badge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 transition-all">
          <i class="fa-solid fa-crown text-[10px] text-amber-400"></i>
          <span id="plan-text">Plano Grátis</span>
        </button>
      </div>
    </header>

    <!-- Main Dynamic Content Container -->
    <main id="main-content" class="flex-1 p-4 md:p-6 overflow-y-auto">
      <!-- Content renders dynamically via Javascript -->
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-4xl mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 px-2 py-1.5 flex justify-around items-center md:sticky md:border-t-0 md:bg-transparent">
      <button onclick="app.navigate('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
        <span>Início</span>
      </button>

      <button onclick="app.navigate('quotes')" id="nav-quotes" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-file-invoice text-lg mb-0.5"></i>
        <span>Orçamentos</span>
      </button>

      <button onclick="app.startNewQuote()" class="w-12 h-12 -mt-5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center shadow-lg shadow-emerald-600/30 active:scale-95 transition-all">
        <i class="fa-solid fa-plus text-xl"></i>
      </button>

      <button onclick="app.navigate('clients')" id="nav-clients" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-users text-lg mb-0.5"></i>
        <span>Clientes</span>
      </button>

      <button onclick="app.navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors">
        <i class="fa-solid fa-gear text-lg mb-0.5"></i>
        <span>Ajustes</span>
      </button>
    </nav>
  </div>

  <!-- Global Notification Toast -->
  <div id="toast" class="fixed top-16 right-4 z-50 transform translate-y-[-100px] opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700 max-w-sm">
      <div id="toast-icon" class="text-emerald-400 text-lg">
        <i class="fa-solid fa-circle-check"></i>
      </div>
      <p id="toast-message" class="text-sm font-medium">Operação realizada!</p>
    </div>
  </div>

  <!-- Modal Container -->
  <div id="modal-container" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div id="modal-content" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto transform transition-all"></div>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ecxgdndfyazyyhhctlgc.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_bqcC7xQtqTxSe_GSMBxoYA_a_EIk8qK';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  </script>

  <script>
    const DEFAULT_PROFILE = {
      name: 'Carlos Oliveira - Serviço Elétrico',
      tradeName: 'EletroPro Soluções',
      document: '12.345.678/0001-90',
      phone: '11987654321',
      email: 'carlos.eletropro@gmail.com',
      address: 'Rua das Flores, 120 - São Paulo, SP',
      logoUrl: '',
      primaryColor: '#16a34a',
      pixKey: '11987654321',
      footerTerms: 'Orçamento válido por 7 dias. Pagamento em até 3x no cartão sem juros ou 5% de desconto no Pix.',
      profession: 'Eletricista',
      plan: 'free',
      nextQuoteNumber: 1001,
      nextReceiptNumber: 101
    };

    const INITIAL_CLIENTS = [
      { id: 'cli_1', name: 'Ana Maria Silva', phone: '11999887766', email: 'ana.silva@email.com', document: '123.456.789-00', address: 'Av. Paulista, 1000 - Apt 42, SP' }
    ];

    const INITIAL_CATALOG = [
      { id: 'cat_1', description: 'Instalação de Chuveiro Elétrico', unit: 'serviço', defaultPrice: 120.00 },
      { id: 'cat_2', description: 'Troca de Disjuntor no Quadro de Força', unit: 'un', defaultPrice: 85.00 }
    ];

    class OrçaJaApp {
      constructor() {
        this.loadState();
        this.currentTab = 'dashboard';
        this.activeQuote = null;
      }

      loadState() {
        this.profile = JSON.parse(localStorage.getItem('orca_profile')) || DEFAULT_PROFILE;
        this.clients = JSON.parse(localStorage.getItem('orca_clients')) || INITIAL_CLIENTS;
        this.catalog = JSON.parse(localStorage.getItem('orca_catalog')) || INITIAL_CATALOG;
        this.quotes = JSON.parse(localStorage.getItem('orca_quotes')) || [];
        this.receipts = JSON.parse(localStorage.getItem('orca_receipts')) || [];
      }

      saveState() {
        localStorage.setItem('orca_profile', JSON.stringify(this.profile));
        localStorage.setItem('orca_clients', JSON.stringify(this.clients));
        localStorage.setItem('orca_catalog', JSON.stringify(this.catalog));
        localStorage.setItem('orca_quotes', JSON.stringify(this.quotes));
        localStorage.setItem('orca_receipts', JSON.stringify(this.receipts));
        this.updateHeaderBadge();
      }

      async init() {
        await this.syncProfileWithSupabase();
        this.updateHeaderBadge();
        this.navigate('dashboard');
      }

      async syncProfileWithSupabase() {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('pro_success') === 'true') {
          this.profile.plan = 'pro';
          this.saveState();
          this.showToast('Pagamento confirmado! Plano Pro ativado com sucesso! 🎉');
          window.history.replaceState({}, document.title, window.location.pathname);
        }
      }

      updateHeaderBadge() {
        const isPro = this.profile.plan === 'pro';
        const badgeText = document.getElementById('plan-text');
        const badgeBtn = document.getElementById('plan-badge');

        if (isPro) {
          badgeText.textContent = 'Plano Pro';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-400/20 text-amber-300 border border-amber-400/40';
        } else {
          badgeText.textContent = `Grátis (${this.quotes.length}/5)`;
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 transition-all';
        }
      }

      showToast(message, type = 'success') {
        const toast = document.getElementById('toast');
        const msgEl = document.getElementById('toast-message');
        const iconEl = document.getElementById('toast-icon');

        msgEl.textContent = message;
        iconEl.className = type === 'error' ? 'text-rose-400 text-lg' : 'text-emerald-400 text-lg';
        iconEl.innerHTML = type === 'error' ? '<i class="fa-solid fa-circle-exclamation"></i>' : '<i class="fa-solid fa-circle-check"></i>';

        toast.classList.remove('translate-y-[-100px]', 'opacity-0');
        toast.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => {
          toast.classList.add('translate-y-[-100px]', 'opacity-0');
          toast.classList.remove('translate-y-0', 'opacity-100');
        }, 3000);
      }

      navigate(tab, params = {}) {
        this.currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(btn => {
          btn.classList.remove('text-emerald-600', 'font-bold');
          btn.classList.add('text-slate-500');
        });
        const activeNav = document.getElementById(`nav-${tab}`);
        if (activeNav) {
          activeNav.classList.remove('text-slate-500');
          activeNav.classList.add('text-emerald-600', 'font-bold');
        }

        const container = document.getElementById('main-content');
        switch (tab) {
          case 'dashboard': container.innerHTML = this.renderDashboard(); break;
          case 'quotes': container.innerHTML = this.renderQuotesList(); break;
          case 'editor': container.innerHTML = this.renderQuoteEditor(params.quoteId); break;
          case 'clients': container.innerHTML = this.renderClientsList(); break;
          case 'settings': container.innerHTML = this.renderSettings(); break;
          default: container.innerHTML = this.renderDashboard();
        }
      }

      renderDashboard() {
        const approvedValue = this.quotes.filter(q => q.status === 'Aprovado').reduce((sum, q) => sum + q.total, 0);
        const totalSent = this.quotes.filter(q => q.status === 'Enviado' || q.status === 'Aprovado').length;
        const totalApproved = this.quotes.filter(q => q.status === 'Aprovado').length;
        const recentQuotes = [...this.quotes].reverse().slice(0, 5);

        return `
          <div class="space-y-6 animate-fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
              <div class="absolute -right-6 -bottom-6 text-slate-800 text-9xl font-black pointer-events-none opacity-40"><i class="fa-solid fa-calculator"></i></div>
              <div class="relative z-10">
                <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">${this.profile.profession || 'Prestador'}</span>
                <h2 class="text-xl sm:text-2xl font-bold mt-2">${this.profile.name || 'Olá, Prestador!'}</h2>
                <p class="text-sm text-slate-300 mt-0.5">Gerencie seus orçamentos rápidos em um só lugar.</p>
              </div>
              <div class="relative z-10">
                <button onclick="app.startNewQuote()" class="w-full sm:w-auto px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2 active:scale-95">
                  <i class="fa-solid fa-plus-circle text-base"></i><span>Novo Orçamento</span>
                </button>
              </div>
            </div>

            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">
              <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-slate-500 mb-2"><span class="text-xs font-semibold uppercase tracking-wide">Aprovados</span><div class="w-8 h-8 rounded-lg bg-emerald-50 text-emerald-600 flex items-center justify-center"><i class="fa-solid fa-circle-check"></i></div></div>
                <div><p class="text-xl sm:text-2xl font-black text-slate-900">${this.formatCurrency(approvedValue)}</p><p class="text-[11px] text-slate-400 font-medium mt-0.5">${totalApproved} orçamentos convertidos</p></div>
              </div>
              <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-slate-500 mb-2"><span class="text-xs font-semibold uppercase tracking-wide">Enviados</span><div class="w-8 h-8 rounded-lg bg-blue-50 text-blue-600 flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></div></div>
                <div><p class="text-xl sm:text-2xl font-black text-slate-900">${totalSent}</p><p class="text-[11px] text-slate-400 font-medium mt-0.5">Entregues no WhatsApp</p></div>
              </div>
              <div class="col-span-2 sm:col-span-1 bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-col justify-between">
                <div class="flex items-center justify-between text-slate-500 mb-2"><span class="text-xs font-semibold uppercase tracking-wide">Uso do Plano</span><div class="w-8 h-8 rounded-lg bg-purple-50 text-purple-600 flex items-center justify-center"><i class="fa-solid fa-chart-simple"></i></div></div>
                <div>
                  <div class="flex items-center justify-between"><p class="text-xl sm:text-2xl font-black text-slate-900">${this.profile.plan === 'pro' ? 'Ilimitado' : this.quotes.length + '/5'}</p><span class="text-xs font-bold ${this.profile.plan === 'pro' ? 'text-amber-500' : 'text-slate-400'}">${this.profile.plan === 'pro' ? 'Pro' : 'Grátis'}</span></div>
                  ${this.profile.plan !== 'pro' ? `<div class="w-full bg-slate-100 rounded-full h-2 mt-2 overflow-hidden"><div class="bg-emerald-500 h-2 rounded-full" style="width: ${(this.quotes.length/5)*100}%"></div></div>` : ''}
                </div>
              </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
              <div class="px-5 py-4 border-b border-slate-100 flex items-center justify-between">
                <h3 class="font-bold text-slate-900 flex items-center space-x-2"><i class="fa-solid fa-clock-rotate-left text-emerald-600"></i><span>Últimos Orçamentos</span></h3>
                <button onclick="app.navigate('quotes')" class="text-xs font-semibold text-emerald-600 hover:text-emerald-700">Ver Todos &rarr;</button>
              </div>
              <div class="divide-y divide-slate-100">
                ${recentQuotes.length === 0 ? `<div class="p-8 text-center text-slate-400"><p class="text-sm font-medium">Nenhum orçamento criado ainda.</p><button onclick="app.startNewQuote()" class="mt-3 text-xs font-bold text-emerald-600 underline">Criar meu primeiro orçamento</button></div>` : recentQuotes.map(q => this.renderQuoteCardRow(q)).join('')}
              </div>
            </div>
          </div>
        `;
      }

      renderQuoteCardRow(q) {
        return `
          <div class="p-4 hover:bg-slate-50 transition-colors flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex items-start space-x-3">
              <div class="w-10 h-10 rounded-lg bg-slate-100 font-bold text-slate-600 flex items-center justify-center shrink-0 text-xs">#${q.number}</div>
              <div>
                <h4 class="font-bold text-slate-900 text-sm">${q.clientName || 'Cliente'}</h4>
                <div class="flex items-center space-x-2 text-xs text-slate-500 mt-1"><span>${this.formatDate(q.date)}</span><span>•</span><span>${q.items?.length || 1} itens</span></div>
              </div>
            </div>
            <div class="flex items-center justify-between sm:justify-end gap-3 pt-2 sm:pt-0 border-t sm:border-t-0 border-slate-100">
              <div class="text-left sm:text-right">
                <span class="text-sm font-extrabold text-slate-900 block">${this.formatCurrency(q.total)}</span>
                <span class="inline-block text-[10px] font-bold px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200">${q.status}</span>
              </div>
              <div class="flex items-center space-x-1">
                <button onclick="app.previewPDF('${q.id}')" class="p-2 text-slate-500 hover:text-rose-600 rounded-lg"><i class="fa-solid fa-file-pdf"></i></button>
                <button onclick="app.shareQuoteWhatsApp('${q.id}')" class="p-2 text-slate-500 hover:text-emerald-600 rounded-lg"><i class="fa-brands fa-whatsapp text-lg"></i></button>
              </div>
            </div>
          </div>
        `;
      }

      renderQuotesList() {
        return `
          <div class="space-y-4 animate-fade-in">
            <div class="flex justify-between items-center"><h2 class="text-xl font-bold text-slate-900">Seus Orçamentos</h2><button onclick="app.startNewQuote()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center space-x-1"><i class="fa-solid fa-plus"></i><span>Novo</span></button></div>
            <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden">
              ${this.quotes.length === 0 ? `<div class="p-8 text-center text-slate-400 text-sm">Nenhum orçamento encontrado.</div>` : this.quotes.map(q => this.renderQuoteCardRow(q)).join('')}
            </div>
          </div>
        `;
      }

      startNewQuote() {
        if (this.profile.plan === 'free' && this.quotes.length >= 5) {
          this.openPaywall();
          return;
        }

        const newQuote = {
          id: 'q_' + Date.now(),
          number: this.profile.nextQuoteNumber || 1001,
          clientName: this.clients[0]?.name || 'Cliente Padrão',
          date: new Date().toISOString().split('T')[0],
          validityDays: 7,
          status: 'Rascunho',
          items: [{ description: 'Serviço de Prestação / Mão de Obra', quantity: 1, unit: 'serviço', unitPrice: 150.00, subtotal: 150.00 }],
          discountType: 'valor',
          discountValue: 0,
          extraFee: 0,
          subtotal: 150.00,
          total: 150.00,
          paymentMethod: 'Pix ou Cartão',
          timeframe: 'Imediato',
          notes: this.profile.footerTerms
        };

        this.activeQuote = newQuote;
        this.navigate('editor');
      }

      renderQuoteEditor(quoteId) {
        if (quoteId) {
          const ex = this.quotes.find(q => q.id === quoteId);
          if (ex) this.activeQuote = JSON.parse(JSON.stringify(ex));
        }
        if (!this.activeQuote) { this.startNewQuote(); return ''; }
        const q = this.activeQuote;

        return `
          <div class="space-y-5 animate-fade-in pb-12">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <button onclick="app.navigate('quotes')" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-arrow-left text-xs"></i></button>
              <h2 class="text-lg font-bold text-slate-900">Orçamento #${q.number}</h2>
              <button onclick="app.saveActiveQuote(true)" class="px-3 py-2 bg-slate-900 text-white font-bold rounded-xl text-xs">Salvar</button>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
              <label class="text-xs font-extrabold uppercase text-slate-500">Nome do Cliente</label>
              <input type="text" value="${q.clientName}" oninput="app.activeQuote.clientName = this.value" class="w-full p-2 text-sm border border-slate-200 rounded-lg font-bold">
            </div>
            <div class="bg-slate-900 text-white p-4 rounded-xl space-y-3">
              <div class="flex justify-between text-xs"><span class="text-slate-300">Total:</span><span class="text-2xl font-black text-white">${this.formatCurrency(q.total)}</span></div>
            </div>
            <div class="sticky bottom-16 bg-white p-3 rounded-2xl border shadow-xl flex justify-end">
              <button onclick="app.previewPDFFromEditor()" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center space-x-2"><i class="fa-solid fa-file-pdf"></i><span>Gerar PDF</span></button>
            </div>
          </div>
        `;
      }

      saveActiveQuote(notify = false) {
        if (!this.activeQuote) return;
        const index = this.quotes.findIndex(q => q.id === this.activeQuote.id);
        if (index >= 0) {
          this.quotes[index] = this.activeQuote;
        } else {
          if (this.profile.plan === 'free' && this.quotes.length >= 5) {
            this.openPaywall();
            return;
          }
          this.quotes.push(this.activeQuote);
          this.profile.nextQuoteNumber += 1;
        }
        this.saveState();
        if (notify) this.showToast('Orçamento salvo com sucesso!');
      }

      previewPDFFromEditor() {
        this.saveActiveQuote(false);
        this.previewPDF(this.activeQuote.id);
      }

      previewPDF(id) {
        const q = this.quotes.find(item => item.id === id);
        if (!q) return;
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `
          <div class="p-6 space-y-4">
            <div class="flex justify-between border-b pb-3"><h3 class="font-bold">Pré-visualização</h3><button onclick="app.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>
            <div class="p-6 border rounded-xl bg-white space-y-4 text-sm">
              <h2 class="text-xl font-bold text-emerald-600">${this.profile.tradeName}</h2>
              <p><strong>Cliente:</strong> ${q.clientName}</p>
              <p><strong>Total:</strong> ${this.formatCurrency(q.total)}</p>
              ${this.profile.plan !== 'pro' ? '<p class="text-xs text-slate-400 text-center pt-4 border-t">Criado com Orça Já</p>' : ''}
            </div>
            <div class="flex justify-end"><button onclick="window.print()" class="px-4 py-2 bg-slate-900 text-white rounded-xl text-xs font-bold">Imprimir PDF</button></div>
          </div>
        `;
        modal.classList.remove('hidden');
      }

      closeModal() { document.getElementById('modal-container')?.classList.add('hidden'); }

      openPaywall() {
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `
          <div class="p-6 space-y-5 bg-slate-900 text-white rounded-2xl">
            <div class="flex justify-between items-start">
              <div>
                <span class="text-xs font-extrabold text-amber-400 uppercase tracking-widest bg-amber-400/10 px-2.5 py-1 rounded-full border border-amber-400/20">Seja Pro</span>
                <h3 class="text-2xl font-black mt-2">Limite Gratuito Atingido (5/5)</h3>
              </div>
              <button onclick="app.closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <p class="text-xs text-slate-300">Escolha uma das opções abaixo para desbloquear orçamentos ilimitados e remover a marca d'água:</p>
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
              <div class="p-4 bg-gradient-to-br from-emerald-600 to-teal-700 rounded-xl space-y-3 border border-emerald-500">
                <p class="text-sm font-bold text-emerald-100">Plano Pro Anual</p>
                <p class="text-xl font-black text-white">R$ 119,00 <span class="text-xs font-normal">/ano</span></p>
                <a href="https://cerefy.com.br/checkout/c9d342ca-5bb0-454e-b861-eb36dbefa9e8" target="_blank" class="w-full py-2.5 bg-white text-slate-900 font-extrabold rounded-xl text-xs text-center block">Assinar Anual</a>
              </div>
              <div class="p-4 bg-slate-800 rounded-xl space-y-3 border border-slate-700">
                <p class="text-sm font-bold text-slate-200">Plano Pro Mensal</p>
                <p class="text-xl font-black text-white">Mensal</p>
                <a href="https://cerefy.com.br/checkout/442c9856-0ce9-474e-bb2f-260c93534c40" target="_blank" class="w-full py-2.5 bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-extrabold rounded-xl text-xs text-center block">Assinar Mensal</a>
              </div>
            </div>
          </div>
        `;
        modal.classList.remove('hidden');
      }

      formatCurrency(val) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0); }
      formatDate(str) { if (!str) return ''; const [y,m,d] = str.split('-'); return `${d}/${m}/${y}`; }
      renderClientsList() { return `<div class="p-6 text-slate-500 text-sm">Gerenciamento de Clientes.</div>`; }
      renderSettings() { return `<div class="p-6 text-slate-500 text-sm">Configurações do Prestador.</div>`; }
    }

    let app;
    window.onload = async function() {
      app = new OrçaJaApp();
      await app.init();
    };
  </script>
</body>
</html>
