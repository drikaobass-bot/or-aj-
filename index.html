<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Orça Já - Gerador de Orçamentos e Recibos</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = { darkMode: 'class', theme: { extend: { colors: { brand: { 50: '#f0fdf4', 100: '#dcfce7', 500: '#22c55e', 600: '#16a34a', 700: '#15803d', 800: '#166534' } }, fontFamily: { sans: ['Inter', 'sans-serif'] } } } }
  </script>
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #f1f5f9; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    .a4-page { min-height: 297mm; width: 100%; max-width: 210mm; margin: 0 auto; background: white; page-break-after: always; }
    @media print {
      html, body { background: white !important; margin: 0 !important; padding: 0 !important; height: auto !important; overflow: visible !important; }
      #app, #toast, .no-print, header, nav, button:not(#printable-document button) { display: none !important; }
      #modal-container { position: static !important; background: white !important; padding: 0 !important; margin: 0 !important; display: block !important; overflow: visible !important; }
      #modal-content { max-height: none !important; box-shadow: none !important; border: none !important; padding: 0 !important; margin: 0 !important; width: 100% !important; max-width: 100% !important; }
      #printable-document { position: static !important; width: 100% !important; max-width: 100% !important; min-height: auto !important; margin: 0 !important; padding: 10mm !important; box-shadow: none !important; border: none !important; page-break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased min-h-screen pb-20 md:pb-6">
  <div id="app" class="max-w-4xl mx-auto min-h-screen flex flex-col bg-white shadow-xl md:my-4 md:rounded-2xl overflow-hidden border border-slate-200">
    <header class="bg-slate-900 text-white px-4 py-3 sticky top-0 z-30 flex items-center justify-between border-b border-slate-800 shadow-sm">
      <div class="flex items-center space-x-3">
        <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-emerald-500 to-green-400 flex items-center justify-center font-bold text-slate-900 shadow-md"><i class="fa-solid fa-bolt text-lg"></i></div>
        <div><h1 class="font-extrabold text-lg tracking-tight text-white leading-none">Orça Já</h1><p class="text-[11px] text-slate-400 font-medium">Orçamentos & Recibos em 1 min</p></div>
      </div>
      <div class="flex items-center space-x-2">
        <button onclick="if(window.app) app.openPaywall()" id="plan-badge" class="flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 hover:bg-emerald-500/20 transition-all">
          <i class="fa-solid fa-crown text-[10px] text-amber-400"></i><span id="plan-text">Carregando…</span>
        </button>
        <button onclick="if(window.app) app.openAuthModal()" id="auth-btn" class="px-3 py-1 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold rounded-lg transition-all">Entrar</button>
      </div>
    </header>
    <main id="main-content" class="flex-1 p-4 md:p-6 overflow-y-auto"></main>
    <nav class="fixed bottom-0 left-0 right-0 max-w-4xl mx-auto bg-white/95 backdrop-blur-md border-t border-slate-200 z-40 px-2 py-1.5 flex justify-around items-center md:sticky md:border-t-0 md:bg-transparent">
      <button onclick="if(window.app) app.navigate('dashboard')" id="nav-dashboard" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors"><i class="fa-solid fa-chart-pie text-lg mb-0.5"></i><span>Início</span></button>
      <button onclick="if(window.app) app.navigate('quotes')" id="nav-quotes" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors"><i class="fa-solid fa-file-invoice text-lg mb-0.5"></i><span>Orçamentos</span></button>
      <button onclick="if(window.app) app.startNewQuote()" class="w-12 h-12 -mt-5 rounded-full bg-emerald-600 hover:bg-emerald-700 text-white flex items-center justify-center shadow-lg shadow-emerald-600/30 active:scale-95 transition-all"><i class="fa-solid fa-plus text-xl"></i></button>
      <button onclick="if(window.app) app.navigate('receipts')" id="nav-receipts" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors"><i class="fa-solid fa-receipt text-lg mb-0.5"></i><span>Recibos</span></button>
      <button onclick="if(window.app) app.navigate('clients')" id="nav-clients" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors"><i class="fa-solid fa-users text-lg mb-0.5"></i><span>Clientes</span></button>
      <button onclick="if(window.app) app.navigate('settings')" id="nav-settings" class="nav-btn flex flex-col items-center py-1 px-3 rounded-lg text-xs font-medium text-slate-500 transition-colors"><i class="fa-solid fa-gear text-lg mb-0.5"></i><span>Ajustes</span></button>
    </nav>
  </div>
  <div id="toast" class="fixed top-16 right-4 z-50 transform translate-y-[-100px] opacity-0 transition-all duration-300 pointer-events-none">
    <div class="bg-slate-900 text-white px-4 py-3 rounded-xl shadow-2xl flex items-center space-x-3 border border-slate-700 max-w-sm">
      <div id="toast-icon" class="text-emerald-400 text-lg"><i class="fa-solid fa-circle-check"></i></div>
      <p id="toast-message" class="text-sm font-medium">Operação realizada!</p>
    </div>
  </div>
  <div id="modal-container" onclick="if(window.app) app.handleModalBackdropClick(event)" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 sm:p-4 overflow-y-auto">
    <div id="modal-content" onclick="event.stopPropagation()" class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full max-h-[90vh] overflow-y-auto transform transition-all"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://ecxgdndfyazyyhhctlgc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVjeGdkbmRmeWF6eXloaGN0bGdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE1NTA1NjUsImV4cCI6MjEwNzEyNjU2NX0.Heypx90Tvayc1c6-Y0T_YiBXNZvs1-BOEFxPF_YBNnM';
    const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const VISITOR_KEY = 'orca_visitor_id';
    function getVisitorId() {
      let id = localStorage.getItem(VISITOR_KEY);
      if (!id) {
        id = 'v_' + (crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36));
        localStorage.setItem(VISITOR_KEY, id);
      }
      return id;
    }
  </script>

  <script>
    const DEFAULT_PROFILE = {
      name: '', tradeName: '', document: '', phone: '', email: '',
      address: '', profession: 'Prestador de Serviços', pixKey: '',
      footerTerms: 'Orçamento válido por 7 dias. Pagamento em até 3x no cartão sem juros ou 5% de desconto no Pix.'
    };

    const QUOTE_STATUSES = ['Rascunho', 'Enviado', 'Aprovado', 'Recusado'];
    const SUBSCRIPTION_CHECK_INTERVAL = 5 * 60 * 1000;

    const EMPTY_ACCESS = {
      access: false, is_pro: false, is_admin: false, has_free_trial: false,
      can_create_quote: false, quote_count: 0, anonymous: true
    };

    class OrçaJaApp {
      constructor() {
        this.user = null;
        this.profile = { ...DEFAULT_PROFILE };
        this.accessInfo = { ...EMPTY_ACCESS };
        this.subscription = null;
        this.clients = [];
        this.quotes = [];
        this.receipts = [];
        this.currentTab = 'dashboard';
        this.activeQuote = null;
        this.subscriptionTimer = null;
        this.backendWarned = false;
        this.visitorId = getVisitorId();
      }

      generateId() {
        if (window.crypto && typeof crypto.randomUUID === 'function') return crypto.randomUUID();
        return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0;
          const v = c === 'x' ? r : (r & 0x3 | 0x8);
          return v.toString(16);
        });
      }
      formatCurrency(val) { return new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0); }
      formatDate(str) { if (!str) return ''; const parts = String(str).split('-'); if (parts.length !== 3) return str; const [y, m, d] = parts; return `${d}/${m}/${y}`; }
      escapeHTML(str) { if (str == null) return ''; return String(str).replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)); }

      isPro() { return !!(this.accessInfo && (this.accessInfo.is_pro || this.accessInfo.is_admin)); }
      isAdmin() { return !!(this.accessInfo && this.accessInfo.is_admin); }
      hasFullAccess() { if (this.isPro()) return true; return !!(this.accessInfo && this.accessInfo.has_free_trial === true); }

      requireFullAccess(actionLabel = 'esta função') {
        if (!this.hasFullAccess()) { this.showToast('Assine o plano Pro para ' + actionLabel + '.', 'error'); this.openPaywall(); return false; }
        return true;
      }

      async init() {
        try {
          const { data: { session } } = await supabaseClient.auth.getSession();
          this.user = session?.user || null;
          if (this.user) {
            await this.loadUserDataFromSupabase();
            await this.loadSubscription();
          } else {
            this.loadLocalFallback();
          }
          await this.loadAccessStatus();
          this.updateHeaderBadge();
          this.navigate('dashboard');
          this.startSubscriptionWatcher();
        } catch (e) {
          console.error('Erro init:', e);
          this.accessInfo = { ...EMPTY_ACCESS };
          this.updateHeaderBadge();
          this.navigate('dashboard');
        }
      }

      startSubscriptionWatcher() {
        if (this.subscriptionTimer) clearInterval(this.subscriptionTimer);
        this.subscriptionTimer = setInterval(async () => {
          await this.loadAccessStatus();
          if (this.user) await this.loadSubscription();
          this.updateHeaderBadge();
        }, SUBSCRIPTION_CHECK_INTERVAL);
        document.addEventListener('visibilitychange', async () => {
          if (document.visibilityState === 'visible') {
            await this.loadAccessStatus();
            if (this.user) await this.loadSubscription();
            this.updateHeaderBadge();
          }
        });
      }

      async loadAccessStatus() {
        try {
          const params = this.user ? { visitor_id: null } : { visitor_id: this.visitorId };
          const { data, error } = await supabaseClient.rpc('check_access', params);
          if (error) {
            console.error('Erro ao verificar acesso:', error);
            const msg = (error.message || '').toLowerCase();
            if (!this.backendWarned && (msg.includes('function') || msg.includes('not found') || msg.includes('does not exist'))) {
              this.backendWarned = true;
              this.showToast('Backend não configurado. Rode o SQL no Supabase.', 'error');
            }
            return;
          }
          if (data && typeof data === 'object') {
            this.accessInfo = {
              access: !!data.access, is_pro: !!data.is_pro, is_admin: !!data.is_admin,
              has_free_trial: !!data.has_free_trial, can_create_quote: !!data.can_create_quote,
              quote_count: Number(data.quote_count) || 0,
              plan_type: data.plan_type, end_date: data.end_date, anonymous: !!data.anonymous
            };
          }
        } catch (e) { console.error('Erro RPC check_access:', e); }
      }

      async loadSubscription() {
        if (!this.user) { this.subscription = null; return; }
        try {
          const { data } = await supabaseClient.from('subscriptions').select('*').eq('user_id', this.user.id).order('created_at', { ascending: false }).limit(1).maybeSingle();
          if (!data) { this.subscription = null; return; }
          const now = new Date(); const end = new Date(data.end_date);
          this.subscription = { ...data, isActive: data.status === 'active' && end > now, daysRemaining: (data.status === 'active' && end > now) ? Math.ceil((end - now) / (1000 * 60 * 60 * 24)) : 0 };
        } catch (e) { this.subscription = null; }
      }

      loadLocalFallback() {
        try {
          this.profile = JSON.parse(localStorage.getItem('orca_profile')) || { ...DEFAULT_PROFILE };
          this.clients = JSON.parse(localStorage.getItem('orca_clients')) || [];
          this.quotes = JSON.parse(localStorage.getItem('orca_quotes')) || [];
          this.receipts = JSON.parse(localStorage.getItem('orca_receipts')) || [];
        } catch (e) { this.profile = { ...DEFAULT_PROFILE }; this.clients = []; this.quotes = []; this.receipts = []; }
      }

      async loadUserDataFromSupabase() {
        if (!this.user) return;
        try {
          let { data: profileData } = await supabaseClient.from('profiles').select('*').eq('id', this.user.id).maybeSingle();
          if (!profileData) {
            const newProf = { id: this.user.id, email: this.user.email };
            const { error: insErr } = await supabaseClient.from('profiles').upsert([newProf], { onConflict: 'id' });
            if (!insErr) profileData = newProf;
          }
          if (profileData) {
            this.profile = {
              name: profileData.name || '', tradeName: profileData.trade_name || '', document: profileData.document || '',
              phone: profileData.phone || '', email: profileData.email || this.user.email || '', address: profileData.address || '',
              profession: profileData.profession || 'Prestador de Serviços', pixKey: profileData.pix_key || '',
              footerTerms: profileData.footer_terms || DEFAULT_PROFILE.footerTerms,
            };
          }
          const { data: clientsData } = await supabaseClient.from('clients').select('*').eq('user_id', this.user.id).order('name', { ascending: true });
          this.clients = (clientsData || []).map(c => ({ id: c.id, name: c.name || '', phone: c.phone || '', email: c.email || '', address: c.address || '' }));
          const { data: quotesData } = await supabaseClient.from('quotes').select('*').eq('user_id', this.user.id).order('number', { ascending: false });
          this.quotes = (quotesData || []).map(q => ({ id: q.id, number: q.number, clientName: q.client_name || '', date: q.date, validityDays: q.validity_days || 7, status: q.status || 'Rascunho', items: Array.isArray(q.items) ? q.items : [], discountType: q.discount_type || 'valor', discountValue: Number(q.discount_value) || 0, extraFee: Number(q.extra_fee) || 0, subtotal: Number(q.subtotal) || 0, total: Number(q.total) || 0, paymentMethod: q.payment_method || '', timeframe: q.timeframe || '', notes: q.notes || '' }));
          const { data: receiptsData } = await supabaseClient.from('receipts').select('*').eq('user_id', this.user.id).order('number', { ascending: false });
          this.receipts = (receiptsData || []).map(r => ({ id: r.id, number: r.number, payerName: r.payer_name || '', receiverName: r.receiver_name || '', date: r.date, amount: Number(r.amount) || 0, description: r.description || '', paymentMethod: r.payment_method || 'Pix', notes: r.notes || '' }));
        } catch (e) { console.error('Erro loadUserData:', e); this.loadLocalFallback(); }
      }

      async saveState() {
        try {
          localStorage.setItem('orca_profile', JSON.stringify(this.profile));
          localStorage.setItem('orca_clients', JSON.stringify(this.clients));
          localStorage.setItem('orca_quotes', JSON.stringify(this.quotes));
          localStorage.setItem('orca_receipts', JSON.stringify(this.receipts));
        } catch (e) {}
        if (this.user) {
          const payload = { id: this.user.id, email: this.profile.email || this.user.email || '', name: this.profile.name || '', trade_name: this.profile.tradeName || '', document: this.profile.document || '', phone: this.profile.phone || '', address: this.profile.address || '', profession: this.profile.profession || '', pix_key: this.profile.pixKey || '', footer_terms: this.profile.footerTerms || '' };
          const { error } = await supabaseClient.from('profiles').upsert(payload, { onConflict: 'id' });
          if (error) console.error('Erro saveState:', error);
        }
        this.updateHeaderBadge();
      }

      updateHeaderBadge() {
        const badgeText = document.getElementById('plan-text');
        const badgeBtn = document.getElementById('plan-badge');
        const authBtn = document.getElementById('auth-btn');
        if (!badgeText) return;

        if (!this.user && !this.accessInfo?.has_free_trial) {
          badgeText.textContent = 'Teste usado';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-500/10 text-slate-400 border border-slate-500/30';
        } else if (!this.user && this.accessInfo?.has_free_trial) {
          badgeText.textContent = 'Teste Grátis';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        } else if (this.isAdmin()) {
          badgeText.textContent = 'Admin';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-purple-400/20 text-purple-300 border border-purple-400/40';
        } else if (this.isPro()) {
          badgeText.textContent = 'Plano Pro';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-amber-400/20 text-amber-300 border border-amber-400/40';
        } else if (this.accessInfo?.has_free_trial) {
          badgeText.textContent = 'Teste Grátis';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-emerald-500/10 text-emerald-400 border border-emerald-500/30';
        } else {
          badgeText.textContent = 'Grátis';
          badgeBtn.className = 'flex items-center space-x-1.5 px-2.5 py-1 rounded-full text-xs font-semibold bg-slate-500/10 text-slate-400 border border-slate-500/30';
        }

        if (this.user) { authBtn.textContent = 'Sair'; authBtn.onclick = () => this.logout(); }
        else { authBtn.textContent = 'Entrar'; authBtn.onclick = () => this.openAuthModal(); }
      }

      async logout() {
        if (this.subscriptionTimer) clearInterval(this.subscriptionTimer);
        await supabaseClient.auth.signOut();
        this.user = null;
        this.profile = { ...DEFAULT_PROFILE };
        this.accessInfo = { ...EMPTY_ACCESS };
        this.subscription = null;
        this.clients = []; this.quotes = []; this.receipts = [];
        try { localStorage.removeItem('orca_profile'); localStorage.removeItem('orca_clients'); localStorage.removeItem('orca_quotes'); localStorage.removeItem('orca_receipts'); } catch (e) {}
        this.showToast('Sessão encerrada.');
        this.init();
      }

      showToast(msg, type = 'success') {
        const t = document.getElementById('toast'); const m = document.getElementById('toast-message'); const i = document.getElementById('toast-icon');
        m.textContent = msg;
        i.className = type === 'error' ? 'text-rose-400 text-lg' : 'text-emerald-400 text-lg';
        i.innerHTML = type === 'error' ? '<i class="fa-solid fa-circle-exclamation"></i>' : '<i class="fa-solid fa-circle-check"></i>';
        t.classList.remove('translate-y-[-100px]', 'opacity-0'); t.classList.add('translate-y-0', 'opacity-100');
        setTimeout(() => { t.classList.add('translate-y-[-100px]', 'opacity-0'); t.classList.remove('translate-y-0', 'opacity-100'); }, 3500);
      }

      handleModalBackdropClick(e) { if (e.target && e.target.id === 'modal-container') this.closeModal(); }

      navigate(tab, params = {}) {
        this.currentTab = tab;
        document.querySelectorAll('.nav-btn').forEach(b => { b.classList.remove('text-emerald-600', 'font-bold'); b.classList.add('text-slate-500'); });
        const n = document.getElementById(`nav-${tab}`);
        if (n) { n.classList.remove('text-slate-500'); n.classList.add('text-emerald-600', 'font-bold'); }
        const c = document.getElementById('main-content');
        switch (tab) {
          case 'dashboard': c.innerHTML = this.renderDashboard(); break;
          case 'quotes': c.innerHTML = this.renderQuotesList(); break;
          case 'editor': c.innerHTML = this.renderQuoteEditor(params.quoteId); break;
          case 'receipts': c.innerHTML = this.renderReceiptsList(); break;
          case 'clients': c.innerHTML = this.renderClientsList(); break;
          case 'settings': c.innerHTML = this.renderSettings(); break;
          default: c.innerHTML = this.renderDashboard();
        }
      }

      renderDashboard() {
        const av = this.quotes.filter(q => q.status === 'Aprovado').reduce((s, q) => s + q.total, 0);
        const ts = this.quotes.filter(q => q.status === 'Enviado' || q.status === 'Aprovado').length;
        const ta = this.quotes.filter(q => q.status === 'Aprovado').length;
        const rq = [...this.quotes].slice(0, 5);
        const qc = this.accessInfo?.quote_count ?? this.quotes.length;

        let ul = 'Bloqueado', uv = '0/1';
        if (this.isAdmin()) { ul = 'Admin'; uv = 'Ilimitado'; }
        else if (this.isPro()) { ul = 'Pro'; uv = 'Ilimitado'; }
        else if (this.accessInfo?.has_free_trial) { ul = 'Teste'; uv = `${qc}/1`; }
        else if (!this.user) { ul = 'Expirado'; uv = '1/1'; }
        else if (qc > 0) { ul = 'Expirado'; uv = `${qc}/1`; }

        return `
          <div class="space-y-6 animate-fade-in">
            <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-slate-900 text-white p-5 rounded-2xl shadow-lg relative overflow-hidden">
              <div class="absolute -right-6 -bottom-6 text-slate-800 text-9xl font-black pointer-events-none opacity-40"><i class="fa-solid fa-calculator"></i></div>
              <div class="relative z-10">
                <span class="text-xs font-semibold uppercase tracking-wider text-emerald-400 bg-emerald-500/10 px-2.5 py-1 rounded-full border border-emerald-500/20">${this.escapeHTML(this.profile.profession || 'Prestador')}</span>
                <h2 class="text-xl sm:text-2xl font-bold mt-2">${this.escapeHTML(this.profile.name || 'Olá, Prestador!')}</h2>
                <p class="text-sm text-slate-300 mt-0.5">Gerencie seus orçamentos e recibos rapidamente.</p>
              </div>
              <div class="relative z-10">
                <button onclick="if(window.app) app.startNewQuote()" class="w-full sm:w-auto px-5 py-3 rounded-xl bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold text-sm shadow-lg shadow-emerald-500/20 transition-all flex items-center justify-center space-x-2 active:scale-95">
                  <i class="fa-solid fa-plus-circle text-base"></i><span>Novo Orçamento</span>
                </button>
              </div>
            </div>
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 sm:gap-4">

                <div><p class="text-xl sm:text-2xl font-black text-slate-900">${this.formatCurrency(av)}</p><p class="text-[11px] text-slate-400 font-medium mt-0.5">${ta} orçamentos convertidos</p></div>

      renderQuotesList() {
        return `
          <div class="space-y-4 animate-fade-in">
            <div class="flex justify-between items-center"><h2 class="text-xl font-bold text-slate-900">Seus Orçamentos</h2><button onclick="if(window.app) app.startNewQuote()" class="px-4 py-2 bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center space-x-1"><i class="fa-solid fa-plus"></i><span>Novo</span></button></div>
            <div class="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden">
              ${this.quotes.length === 0 ? `<div class="p-8 text-center text-slate-400 text-sm">Nenhum orçamento encontrado.</div>` : this.quotes.map(q => this.renderQuoteCardRow(q)).join('')}
            </div>
          </div>
        `;
      }

      async startNewQuote() {
        await this.loadAccessStatus();
        if (!this.hasFullAccess()) {
          this.showToast('Assine o plano Pro para criar mais orçamentos.', 'error');
          this.openPaywall();
          return;
        }
        this._createNewQuote();
      }

      _createNewQuote() {
        const n = this.quotes.length > 0 ? Math.max(...this.quotes.map(q => q.number || 1000)) + 1 : 1001;
        this.activeQuote = {
          id: this.generateId(), number: n, clientName: this.clients[0]?.name || '',
          date: new Date().toISOString().split('T')[0], validityDays: 7, status: 'Rascunho',
          items: [{ description: '', quantity: 1, unit: 'serviço', unitPrice: 0, subtotal: 0 }],
          discountType: 'valor', discountValue: 0, extraFee: 0, subtotal: 0, total: 0,
          paymentMethod: 'Pix ou Cartão', timeframe: 'Imediato', notes: this.profile.footerTerms
        };
        this.navigate('editor');
      }

      renderQuoteEditor(quoteId) {
        if (quoteId) {
          const ex = this.quotes.find(q => q.id === quoteId);
          if (ex) {
            if (!this.hasFullAccess()) { setTimeout(() => this.openPaywall(), 0); return '<div class="p-8 text-center text-slate-400">Acesso restrito.</div>'; }
            this.activeQuote = JSON.parse(JSON.stringify(ex));
          }
        }
        if (!this.activeQuote) { this.startNewQuote(); return ''; }
        const q = this.activeQuote;
        if (!Array.isArray(q.items) || q.items.length === 0) q.items = [{ description: '', quantity: 1, unit: 'serviço', unitPrice: 0, subtotal: 0 }];
        const so = QUOTE_STATUSES.map(s => `<option value="${s}" ${q.status === s ? 'selected' : ''}>${s}</option>`).join('');
        return `
          <div class="space-y-5 animate-fade-in pb-20">
            <div class="flex items-center justify-between border-b border-slate-200 pb-3">
              <button onclick="if(window.app) app.navigate('quotes')" class="w-8 h-8 rounded-lg bg-slate-100 flex items-center justify-center text-slate-600"><i class="fa-solid fa-arrow-left text-xs"></i></button>
              <h2 class="text-lg font-bold text-slate-900">Orçamento #${q.number}</h2>
              <button onclick="if(window.app) app.saveActiveQuote(true, true)" class="px-4 py-2 bg-slate-900 text-white font-bold rounded-xl text-xs hover:bg-slate-800 transition-all">Salvar</button>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
              <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-2 md:col-span-2">
                <label class="text-xs font-bold uppercase text-slate-500">Cliente</label>
                <select id="editor-client" onchange="if(window.app) app.updateActiveQuoteClient(this.value)" class="w-full p-2 text-sm border rounded-lg">
                  <option value="">Selecione um cliente...</option>
                  ${this.clients.map(c => `<option value="${this.escapeHTML(c.name)}" ${q.clientName === c.name ? 'selected' : ''}>${this.escapeHTML(c.name)}</option>`).join('')}
                </select>
              </div>
              <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                <label class="text-xs font-bold uppercase text-slate-500">Status</label>
                <select id="editor-status" onchange="if(window.app) app.activeQuote.status = this.value" class="w-full p-2 text-sm border rounded-lg">${so}</select>
              </div>
              <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-2">
                <label class="text-xs font-bold uppercase text-slate-500">Data de Emissão</label>
                <input type="date" value="${q.date}" onchange="if(window.app) app.activeQuote.date = this.value" class="w-full p-2 text-sm border rounded-lg">
              </div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-4">
              <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-900">Itens / Serviços</h3>
                <button onclick="if(window.app) app.addQuoteItem()" class="px-3 py-1.5 bg-emerald-50 text-emerald-600 hover:bg-emerald-100 font-bold rounded-lg text-xs"><i class="fa-solid fa-plus mr-1"></i> Adicionar Item</button>
              </div>
              <div id="quote-items-container" class="space-y-3">
                ${q.items.map((item, idx) => `
                  <div class="p-3 bg-slate-50 border rounded-xl space-y-2 relative">
                    <div class="flex justify-between items-center">
                      <span class="text-xs font-bold text-slate-500">Item #${idx + 1}</span>${q.items.length > 1 ? `<button onclick="if(window.app) app.removeQuoteItem(${idx})" class="text-rose-500 text-xs font-bold"><i class="fa-solid fa-trash"></i></button>` : ''}
                    </div>
                    <input type="text" placeholder="Descrição do serviço ou produto" value="${this.escapeHTML(item.description)}" oninput="if(window.app) app.updateItem(${idx}, 'description', this.value)" class="w-full p-2 text-sm bg-white border rounded-lg">
                    <div class="grid grid-cols-3 gap-2">
                      <div><label class="text-[10px] uppercase text-slate-400 font-bold">Qtd</label><input type="number" step="any" min="0.01" value="${item.quantity}" oninput="if(window.app) app.updateItem(${idx}, 'quantity', this.value)" class="w-full p-1.5 text-sm bg-white border rounded-lg"></div>
                      <div><label class="text-[10px] uppercase text-slate-400 font-bold">Unidade</label><input type="text" value="${this.escapeHTML(item.unit)}" oninput="if(window.app) app.updateItem(${idx}, 'unit', this.value)" class="w-full p-1.5 text-sm bg-white border rounded-lg"></div>
                      <div><label class="text-[10px] uppercase text-slate-400 font-bold">Val. Unitário (R$)</label><input type="number" step="0.01" min="0" value="${item.unitPrice}" oninput="if(window.app) app.updateItem(${idx}, 'unitPrice', this.value)" class="w-full p-1.5 text-sm bg-white border rounded-lg"></div>
                    </div>
                  </div>
                `).join('')}
              </div>
            </div>
            <div class="bg-slate-900 text-white p-5 rounded-xl space-y-3">
              <div class="flex justify-between text-sm"><span>Subtotal:</span><span id="editor-subtotal-val" class="font-bold">${this.formatCurrency(q.subtotal)}</span></div>
              <div class="flex justify-between text-sm items-center">
                <span>Desconto (R$):</span>
                <input type="number" step="0.01" min="0" value="${q.discountValue}" oninput="if(window.app) app.updateDiscount(this.value)" class="w-28 p-1 text-slate-900 text-right text-sm rounded font-bold">
              </div>
              <div class="flex justify-between text-lg border-t border-slate-700 pt-2 font-black text-emerald-400"><span>Total Final:</span><span id="editor-total-val">${this.formatCurrency(q.total)}</span></div>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 space-y-3">
              <label class="text-xs font-bold uppercase text-slate-500">Condições e Observações</label>
              <textarea rows="3" oninput="if(window.app) app.activeQuote.notes = this.value" class="w-full p-2 text-sm border rounded-lg">${this.escapeHTML(q.notes || '')}</textarea>
            </div>
            <div class="sticky bottom-16 bg-white p-3 rounded-2xl border shadow-xl flex justify-end space-x-2 flex-wrap gap-2">
              <button onclick="if(window.app) app.saveActiveQuote(true, false)" class="px-4 py-2.5 bg-slate-900 text-white font-bold rounded-xl text-xs">Salvar</button>
              <button onclick="if(window.app) app.shareWhatsAppEditor()" class="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center space-x-2"><i class="fa-brands fa-whatsapp"></i><span>WhatsApp</span></button>
              <button onclick="if(window.app) app.previewPDFFromEditor()" class="px-5 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs flex items-center space-x-2"><i class="fa-solid fa-file-pdf"></i><span>Gerar PDF</span></button>
            </div>
          </div>
        `;
      }

      updateActiveQuoteClient(n) { if (this.activeQuote) this.activeQuote.clientName = n; }
      addQuoteItem() { if (!this.activeQuote) return; this.activeQuote.items.push({ description: '', quantity: 1, unit: 'un', unitPrice: 0, subtotal: 0 }); this.recalculateQuoteTotals(); this.navigate('editor'); }
      removeQuoteItem(i) { if (!this.activeQuote) return; this.activeQuote.items.splice(i, 1); this.recalculateQuoteTotals(); this.navigate('editor'); }
      updateItem(i, f, v) { if (!this.activeQuote) return; const it = this.activeQuote.items[i]; if (!it) return; if (f === 'quantity' || f === 'unitPrice') { it[f] = v === '' ? 0 : (parseFloat(v) || 0); it.subtotal = (it.quantity || 0) * (it.unitPrice || 0); } else it[f] = v; this.recalculateQuoteTotals(); }
      updateDiscount(v) { if (!this.activeQuote) return; this.activeQuote.discountValue = v === '' ? 0 : Math.max(0, parseFloat(v) || 0); this.recalculateQuoteTotals(); }
      recalculateQuoteTotals() { if (!this.activeQuote) return; const s = (this.activeQuote.items || []).reduce((a, it) => a + (Number(it.subtotal) || 0), 0); const d = Number(this.activeQuote.discountValue) || 0; this.activeQuote.subtotal = s; this.activeQuote.total = Math.max(0, s - d); this.updateEditorTotals(); }
      updateEditorTotals() { if (!this.activeQuote) return; const s = document.getElementById('editor-subtotal-val'); const t = document.getElementById('editor-total-val'); if (s) s.textContent = this.formatCurrency(this.activeQuote.subtotal); if (t) t.textContent = this.formatCurrency(this.activeQuote.total); }

      async saveActiveQuote(notify = false, redirectToList = false) {
        if (!this.activeQuote) return false;
        this.recalculateQuoteTotals();
        const hasValidItem = this.activeQuote.items.some(i => (i.description || '').trim() !== '' && Number(i.subtotal) > 0);
        if (!hasValidItem) { this.showToast('Adicione pelo menos um item válido.', 'error'); return false; }

        const exists = this.quotes.some(q => q.id === this.activeQuote.id);

        // Consome teste se não tem acesso e é orçamento novo
        if (!this.hasFullAccess() && !exists) {
          try {
            const { data, error } = await supabaseClient.rpc('consume_free_trial', { visitor_id: this.visitorId });
            if (error || !data?.success) {
              this.showToast(data?.error || 'Você já utilizou seu orçamento gratuito.', 'error');
              this.openPaywall();
              return false;
            }
            this.accessInfo.has_free_trial = false;
            this.accessInfo.can_create_quote = false;
            this.accessInfo.quote_count = (this.accessInfo.quote_count || 0) + 1;
            this.updateHeaderBadge();
          } catch (e) {
            this.showToast('Erro de conexão.', 'error');
            return false;
          }
        } else if (!this.hasFullAccess() && exists) {
          this.showToast('Assine o plano Pro.', 'error');
          this.openPaywall();
          return false;
        }

        // Salva local
        const i = this.quotes.findIndex(q => q.id === this.activeQuote.id);
        if (i >= 0) this.quotes[i] = { ...this.activeQuote };
        else this.quotes.unshift({ ...this.activeQuote });

        // Se logado, salva também no Supabase
        if (this.user) {
          const p = {
            id: this.activeQuote.id, user_id: this.user.id, number: this.activeQuote.number,
            client_name: this.activeQuote.clientName, date: this.activeQuote.date,
            validity_days: this.activeQuote.validityDays, status: this.activeQuote.status,
            items: this.activeQuote.items, discount_type: this.activeQuote.discountType,
            discount_value: this.activeQuote.discountValue, extra_fee: this.activeQuote.extraFee,
            subtotal: this.activeQuote.subtotal, total: this.activeQuote.total,
            payment_method: this.activeQuote.paymentMethod, timeframe: this.activeQuote.timeframe,
            notes: this.activeQuote.notes
          };
          const { error } = await supabaseClient.from('quotes').upsert(p, { onConflict: 'id' });
          if (error) { this.showToast('Falha ao sincronizar.', 'error'); return false; }
        }

        await this.saveState();
        if (notify) this.showToast('Orçamento salvo!');
        if (redirectToList) this.navigate('quotes');
        return true;
      }

      async deleteQuote(id) {
        if (!this.requireFullAccess('excluir orçamentos')) return;
        if (!confirm('Excluir este orçamento?')) return;
        this.quotes = this.quotes.filter(q => q.id !== id);
        if (this.user) {
          const { error } = await supabaseClient.from('quotes').delete().eq('id', id);
          if (error) { this.showToast('Erro ao excluir.', 'error'); return; }
        }
        await this.saveState();
        this.showToast('Orçamento excluído.');
        this.navigate('quotes');
      }

      async previewPDFFromEditor() { const ok = await this.saveActiveQuote(false, false); if (!ok) return; this.previewPDF(this.activeQuote.id); }

        const modal = document.getElementById('modal-container');

              <div class="flex justify-between border-b pb-4">

              </div>
              <div><p class="text-xs uppercase font-bold text-slate-400">Cliente</p><p class="text-base font-bold text-slate-900">${this.escapeHTML(q.clientName || '—')}</p></div>
              <table class="w-full text-left border-collapse">
                <thead><tr class="border-b bg-slate-50 text-xs text-slate-500 uppercase"><th class="py-2 px-3">Descrição</th><th class="py-2 px-3 text-center">Qtd</th><th class="py-2 px-3 text-right">Unitário</th><th class="py-2 px-3 text-right">Total</th></tr></thead>
                <tbody class="divide-y divide-slate-100 text-xs">
                  ${(q.items || []).map(item => `<tr><td class="py-2.5 px-3 font-medium text-slate-800">${this.escapeHTML(item.description)}</td><td class="py-2.5 px-3 text-center">${item.quantity}${this.escapeHTML(item.unit || '')}</td><td class="py-2.5 px-3 text-right">${this.formatCurrency(item.unitPrice)}</td><td class="py-2.5 px-3 text-right font-bold">${this.formatCurrency(item.subtotal)}</td></tr>`).join('')}
                </tbody>
              </table>
              <div class="flex justify-end pt-4 border-t">
                <div class="w-64 space-y-2 text-xs">
                  <div class="flex justify-between"><span>Subtotal:</span><span>${this.formatCurrency(q.subtotal)}</span></div>
                  ${q.discountValue > 0 ? `<div class="flex justify-between text-rose-600"><span>Desconto:</span><span>- ${this.formatCurrency(q.discountValue)}</span></div>` : ''}
                  <div class="flex justify-between text-sm font-black border-t pt-2 text-slate-900"><span>Total Final:</span><span>${this.formatCurrency(q.total)}</span></div>
                </div>
              </div>
              <div class="pt-6 border-t text-[11px] text-slate-500 space-y-1"><p><strong>Condições:</strong> ${this.escapeHTML(q.notes || this.profile.footerTerms)}</p></div>
            </div>
            <div class="flex justify-end space-x-2 no-print">
              <button onclick="if(window.app) app.shareWhatsApp('${this.escapeHTML(id)}')" class="px-4 py-2.5 bg-emerald-500 hover:bg-emerald-600 text-white rounded-xl text-xs font-bold"><i class="fa-brands fa-whatsapp mr-1"></i> WhatsApp</button>
              <button onclick="window.print()" class="px-5 py-2.5 bg-slate-900 text-white rounded-xl text-xs font-bold"><i class="fa-solid fa-print mr-1"></i> Imprimir / PDF</button>
            </div>
          </div>
        `;
        modal.classList.remove('hidden');
      }

      // =============== WHATSAPP SHARE ===============
      buildQuoteWhatsAppMessage(q) {
        const lines = [];
        lines.push(`*ORÇAMENTO #${q.number}*`);
        lines.push('');
        lines.push(`*Prestador:* ${this.profile.tradeName || this.profile.name || '—'}`);
        if (this.profile.phone) lines.push(`*Contato:* ${this.profile.phone}`);
        lines.push(`*Cliente:* ${q.clientName || '—'}`);
        lines.push(`*Data:* ${this.formatDate(q.date)}`);
        lines.push('');
        lines.push('*ITENS:*');
        (q.items || []).forEach(it => {
          lines.push(`• ${it.description || '—'}`);
          lines.push(`  ${it.quantity}${it.unit || ''} × ${this.formatCurrency(it.unitPrice)} = *${this.formatCurrency(it.subtotal)}*`);
        });
        lines.push('');
        lines.push(`Subtotal: ${this.formatCurrency(q.subtotal)}`);
        if (q.discountValue > 0) lines.push(`Desconto: -${this.formatCurrency(q.discountValue)}`);
        lines.push(`*TOTAL: ${this.formatCurrency(q.total)}*`);
        if (q.notes) {
          lines.push('');
          lines.push(`_${q.notes}_`);
        }
        if (this.profile.pixKey) {
          lines.push('');
          lines.push(`*Chave Pix:* ${this.profile.pixKey}`);
        }
        return lines.join('\n');
      }

      shareWhatsApp(quoteId) {
        if (!this.requireFullAccess('enviar por WhatsApp')) return;
        const q = this.quotes.find(i => i.id === quoteId);
        if (!q) { this.showToast('Orçamento não encontrado.', 'error'); return; }
        const msg = this.buildQuoteWhatsAppMessage(q);
        const url = `https://wa.me/?text=${encodeURIComponent(msg)}`;
        window.open(url, '_blank');
      }

      async shareWhatsAppEditor() {
        if (!this.activeQuote) return;
        // Salva antes de compartilhar (garante que os dados estão consistentes)
        const ok = await this.saveActiveQuote(false, false);
        if (!ok) return;
        this.shareWhatsApp(this.activeQuote.id);
      }

      renderReceiptsList() {

      startNewReceipt() {
        if (!this.requireFullAccess('emitir recibos')) return;
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `
          <div class="p-6 space-y-4">
            <div class="flex justify-between border-b pb-3"><h3 class="font-bold">Emitir Novo Recibo</h3><button onclick="if(window.app) app.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>
            <form onsubmit="if(window.app) app.saveReceipt(event)" class="space-y-3">
              <div><label class="text-xs font-bold uppercase text-slate-500">Nome do Pagador</label><input type="text" id="rcpt-payer" required class="w-full p-2 border rounded-lg text-sm"></div>

                <div><label class="text-xs font-bold uppercase text-slate-500">Valor (R$)</label><input type="number" step="0.01" min="0" id="rcpt-amount" required class="w-full p-2 border rounded-lg text-sm"></div>
                <div><label class="text-xs font-bold uppercase text-slate-500">Data</label><input type="date" id="rcpt-date" value="${new Date().toISOString().split('T')[0]}" required class="w-full p-2 border rounded-lg text-sm"></div>

      async saveReceipt(e) {
        e.preventDefault();
        if (!this.requireFullAccess('emitir recibos')) return;
        const n = this.receipts.length > 0 ? Math.max(...this.receipts.map(r => r.number || 100)) + 1 : 101;
        const nr = { id: this.generateId(), number: n, payerName: document.getElementById('rcpt-payer').value.trim(), receiverName: this.profile.tradeName || this.profile.name || '', date: document.getElementById('rcpt-date').value, amount: parseFloat(document.getElementById('rcpt-amount').value) || 0, description: document.getElementById('rcpt-desc').value.trim(), paymentMethod: 'Pix', notes: '' };
        this.receipts.unshift(nr);
        if (this.user) {
          const { error } = await supabaseClient.from('receipts').insert([{ id: nr.id, user_id: this.user.id, number: nr.number, payer_name: nr.payerName, receiver_name: nr.receiverName, date: nr.date, amount: nr.amount, description: nr.description, payment_method: nr.paymentMethod, notes: nr.notes }]);
          if (error) { this.showToast('Falha ao salvar recibo.', 'error'); return; }
        }
        await this.saveState();
        this.closeModal();
        this.showToast('Recibo emitido!');
        this.navigate('receipts');
      }

      async deleteReceipt(id) {
        if (!this.requireFullAccess('excluir recibos')) return;
        if (!confirm('Excluir este recibo?')) return;
        this.receipts = this.receipts.filter(r => r.id !== id);
        if (this.user) {
          const { error } = await supabaseClient.from('receipts').delete().eq('id', id);
          if (error) { this.showToast('Erro ao excluir.', 'error'); return; }
        }
        await this.saveState();
        this.showToast('Recibo excluído.');
        this.navigate('receipts');
      }

      previewReceiptPDF(id) {

      renderClientsList() {

              <div><label class="text-xs font-bold uppercase text-slate-500">Termos e Condições Padrão de Rodapé</label><textarea id="set-terms" rows="2" class="w-full p-2 border rounded-lg text-sm">${this.escapeHTML(p.footerTerms)}</textarea></div>

            ${this.subscription ? `<div class="bg-white p-5 rounded-xl border border-slate-200 space-y-2"><h3 class="font-bold text-slate-900 text-sm">Sua Assinatura</h3><p class="text-xs text-slate-600">Plano: <strong>${this.subscription.plan_type === 'yearly' ? 'Anual' : 'Mensal'}</strong></p><p class="text-xs text-slate-600">Status: <strong>${this.subscription.status === 'active' ? 'Ativo' : this.subscription.status}</strong></p><p class="text-xs text-slate-600">Válido até: <strong>${this.formatDate(this.subscription.end_date?.split('T')[0])}</strong></p>${this.subscription.isActive && this.subscription.daysRemaining <= 7 ? `<p class="text-xs text-amber-600 font-bold">⚠️ Expira em ${this.subscription.daysRemaining} dia(s).</p>` : ''}</div>` : ''}

      openAuthModal() {
        const modal = document.getElementById('modal-container');
        document.getElementById('modal-content').innerHTML = `

            <div class="flex justify-between border-b pb-3"><h3 class="font-bold text-lg">Acessar / Criar Conta</h3><button onclick="if(window.app) app.closeModal()" class="text-slate-400"><i class="fa-solid fa-xmark text-lg"></i></button></div>

            <form onsubmit="if(window.app) app.handleAuth(event)" class="space-y-3">
              <div><label class="text-xs font-bold uppercase text-slate-500">E-mail</label><input type="email" id="auth-email" required class="w-full p-2 border rounded-lg text-sm"></div>
              <div><label class="text-xs font-bold uppercase text-slate-500">Senha</label><input type="password" id="auth-pass" required minlength="6" class="w-full p-2 border rounded-lg text-sm"></div>
              <div class="flex space-x-2 pt-2">
                <button type="submit" class="flex-1 py-2.5 bg-slate-900 text-white font-bold rounded-xl text-xs">Entrar</button>
                <button type="button" onclick="if(window.app) app.handleSignUp()" class="flex-1 py-2.5 bg-emerald-600 text-white font-bold rounded-xl text-xs">Cadastrar</button>

            </form>
          </div>
        `;
        modal.classList.remove('hidden');

      async handleAuth(e) {
        e.preventDefault();
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-pass').value;
        const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password: pass });
        if (error) { this.showToast('Erro ao entrar: ' + error.message, 'error'); return; }
        this.user = data.user;
        this.closeModal();
        this.showToast('Login realizado!');
        await this.init();
      }

      async handleSignUp() {
        const email = document.getElementById('auth-email').value.trim();
        const pass = document.getElementById('auth-pass').value;
        if (!email || !pass) { this.showToast('Preencha e-mail e senha.', 'error'); return; }
        if (pass.length < 6) { this.showToast('Senha deve ter 6+ caracteres.', 'error'); return; }
        try {
          const { data, error } = await supabaseClient.functions.invoke('create-account', { body: { email, password: pass } });
          if (!error && data && data.success) { this.showToast('Conta criada! Faça login.'); this.closeModal(); return; }
          if (data && data.error) { this.showToast(data.error, 'error'); return; }
        } catch (e) { console.warn('Edge Function indisponível, usando fallback:', e); }
        const { data, error } = await supabaseClient.auth.signUp({ email, password: pass });
        if (error) { this.showToast('Erro no cadastro: ' + error.message, 'error'); return; }
        if (data.session) { this.user = data.user; this.closeModal(); this.showToast('Conta criada!'); await this.init(); }
        else { this.showToast('Cadastro realizado! Verifique seu e-mail.', 'success'); }
      }

          '</div>' +
        '</div>';
        document.getElementById('modal-content').innerHTML = contentHTML;
        modal.classList.remove('hidden');
      }

      closeModal() {
        const modal = document.getElementById('modal-container');
        const content = document.getElementById('modal-content');
        if (content) content.innerHTML = '';
        if (modal) modal.classList.add('hidden');
      }
    }

    let app;
    window.addEventListener('DOMContentLoaded', async () => {
      app = new OrçaJaApp();
      window.app = app;
      await app.init();
    });
  </script>
